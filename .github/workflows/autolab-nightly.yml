name: AUTOLAB nightly research
on:
  pull_request:
    paths:
      - 'autolab/**'
      - '.github/workflows/autolab-nightly.yml'
  push:
    paths:
      - 'autolab/**'
      - '.github/workflows/autolab-nightly.yml'
  workflow_dispatch:
    inputs:
      demo:
        description: 'No-cost demo (true) or paid live run (false)'
        type: boolean
        required: true
        default: true
  schedule:
    - cron: '43 0 * * *'
      timezone: 'Asia/Tokyo'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: autolab-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests (0 API calls)
        run: python -m unittest discover -s autolab/tests -v
      - name: Demo smoke test (0 API calls)
        run: python autolab/run.py --demo
  research:
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.AUTOLAB_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Protect unpublished ideas in public repositories
        env:
          IS_PRIVATE: ${{ github.event.repository.private }}
          PUBLIC_OK: ${{ vars.AUTOLAB_PUBLIC_OK }}
          IS_DEMO: ${{ inputs.demo }}
          TRIGGER: ${{ github.event_name }}
        run: |
          if [ "$IS_PRIVATE" != 'true' ] && [ "$PUBLIC_OK" != 'true' ]; then
            if [ "$TRIGGER" != 'workflow_dispatch' ] || [ "$IS_DEMO" != 'true' ]; then
              echo "::error::Live research blocked: repository is PUBLIC. Use a private repo, or explicitly set AUTOLAB_PUBLIC_OK=true."
              exit 1
            fi
          fi
      - name: Run independent agents
        id: lab
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.demo }}" = "true" ]; then
            python autolab/run.py --demo
          else
            python autolab/run.py --live
          fi
      - name: Commit research logs and optional prototype (only AUTOLAB files)
        if: always() && steps.lab.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add autolab/output/
          if ! git diff --cached --quiet; then
            git commit -m "AUTOLAB research run ${{ github.run_id }}"
            git push
          fi
      - name: Prepare static Pages site (opt-in)
        if: success() && vars.AUTOLAB_PAGES_ENABLED == 'true'
        run: |
          mkdir -p /tmp/autolab-pages/autolab/output
          cp index.html /tmp/autolab-pages/
          cp autolab/output/* /tmp/autolab-pages/autolab/output/
          touch /tmp/autolab-pages/.nojekyll
      - uses: actions/configure-pages@v5
        if: success() && vars.AUTOLAB_PAGES_ENABLED == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: success() && vars.AUTOLAB_PAGES_ENABLED == 'true'
        with:
          path: /tmp/autolab-pages
      - name: Deploy Pages (opt-in, preserves existing root game)
        if: success() && vars.AUTOLAB_PAGES_ENABLED == 'true'
        uses: actions/deploy-pages@v4
