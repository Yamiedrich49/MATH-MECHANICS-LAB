<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7fbfc">
<title>MATH MECHANICS LAB UI v4</title>
<style>
:root{--bg:#f7fbfc;--card:#ffffff;--ink:#173746;--sub:#69818b;--soft:#95acb4;--line:#dbe8ec;--cyan:#00a9c0;--cyan2:#0c8ea2;--pale:#eaf8fa;--red:#eb6b71;--redp:#fff0f0;--blue:#1ea7d0;--bluep:#eef8ff;--ok:#159a8a;--okp:#ecfbf7;--shadow:0 8px 22px rgba(17,60,75,.06);--radius:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior-y:none}
body{min-height:100svh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid #88e6f2;outline-offset:2px}
.shell{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{flex:1}
.over{font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--cyan2)}
.logo{font-size:22px;font-weight:900;letter-spacing:-.05em;line-height:1.2;margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.page{animation:fade .18s ease-out}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:18px 18px 16px;margin-bottom:14px}
.hero h1{font-size:28px;line-height:1.28;letter-spacing:-.06em;margin:4px 0 8px}
.hero p{font-size:13px;line-height:1.75;color:var(--sub);margin:0}
.menu-item{display:flex;gap:14px;align-items:center;padding:16px;margin:12px 0;text-align:left;width:100%}
.menu-illust{width:84px;height:84px;border-radius:18px;background:#eef9fb;display:grid;place-items:center;flex:none}
.menu-body{flex:1;min-width:0}
.menu-no{font-size:10px;color:var(--cyan2);font-weight:900;letter-spacing:.14em}
.menu-name{font-size:18px;font-weight:900;letter-spacing:-.04em;margin:3px 0}
.menu-desc{font-size:12px;line-height:1.65;color:var(--sub)}
.menu-tip{font-size:11px;line-height:1.55;color:#97acb4;margin-top:4px}
.arrow{font-size:24px;color:var(--cyan)}
.small{font-size:11px;color:#96acb4;line-height:1.7;text-align:center;margin:18px 8px 0}
.header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.back{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.header-main{flex:1;min-width:0}
.label{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--cyan2)}
.title{font-size:24px;font-weight:900;letter-spacing:-.055em;line-height:1.25;margin:5px 0 6px}
.sub{font-size:13px;line-height:1.7;color:var(--sub);margin:0}
.row{display:flex;gap:10px}
.toptools{display:flex;gap:8px;align-self:flex-start}
.chipbtn{height:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:13px;display:grid;place-items:center;box-shadow:var(--shadow);font-weight:800;font-size:12px;color:var(--ink)}
.stagebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 13px;margin:14px 0 12px;box-shadow:var(--shadow)}
.stagebar strong{font-size:13px}
.stagebar span{font-size:12px;color:var(--cyan2);font-weight:900}
.boardcard{padding:16px;margin-bottom:12px}
.section{padding:14px;border-radius:17px;background:#fbfeff;border:1px solid #e9f0f2;margin-bottom:12px}
.section:last-child{margin-bottom:0}
.step{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--cyan2);margin-bottom:6px}
.section h3{font-size:18px;letter-spacing:-.04em;line-height:1.3;margin:0 0 6px}
.section p{font-size:12px;color:var(--sub);line-height:1.65;margin:0 0 10px}
.notice{font-size:12px;color:var(--sub);line-height:1.6;background:#f3fafb;border-radius:12px;padding:10px 12px}
.meter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.badge{padding:7px 10px;border-radius:999px;background:#eff8fa;color:var(--cyan2);font-weight:900;font-size:11px;border:1px solid #d4edf1}
.badge.red{background:var(--redp);color:#c75661;border-color:#f5d4d9}
.badge.blue{background:var(--bluep);color:#317fa4;border-color:#d6ebf8}
.grid-wrap{margin-top:10px}
.scan-area{display:grid;grid-template-columns:30px 1fr;grid-template-rows:30px 1fr;gap:6px;max-width:360px;margin:0 auto}
.scan-top{grid-column:2;display:grid;gap:6px}
.scan-side{grid-row:2;display:grid;gap:6px}
.probe{border-radius:10px;background:#eef8fa;border:1px solid #d7edf1;min-height:30px;font-size:12px;font-weight:900;color:var(--cyan2)}
.probe.used{background:var(--cyan);color:white;border-color:var(--cyan)}
.probe.prompt{box-shadow:0 0 0 3px rgba(0,169,192,.16)}
.answergrid,.heatgrid{display:grid;aspect-ratio:1;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--card)}
.cell{border-right:1px solid #e7eef1;border-bottom:1px solid #e7eef1;display:grid;place-items:center}
.ghost{width:68%;height:68%;border-radius:7px;background:var(--cyan)}
.toggle{width:100%;height:100%;background:white}
.toggle.on{background:var(--cyan)}
.toggle.on::after{content:'';display:block;width:68%;height:68%;margin:auto;border-radius:7px;background:white}
.shape-sample{display:flex;justify-content:center;gap:14px;align-items:center;margin:8px 0 2px}
.sample-grid{display:grid;width:62px;height:62px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:white}
.sample-grid div{border-right:1px solid #edf2f4;border-bottom:1px solid #edf2f4}
.sample-grid div.on{background:var(--cyan)}
.actions{display:flex;gap:10px;margin-top:12px}
.action{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:900}
.action.primary{background:var(--cyan);border-color:var(--cyan);color:white}
.action:disabled{opacity:.42;box-shadow:none}
.feedback{margin-top:10px;padding:11px 12px;border-radius:13px;font-size:12px;line-height:1.6}
.feedback.ok{background:var(--okp);color:var(--ok)}
.feedback.ng{background:#fff5ee;color:#bd6b3f}
.feedback.info{background:#f2fafb;color:var(--sub)}
.svgwrap{background:white;border:1px solid var(--line);border-radius:16px;padding:10px}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.edge{stroke:#a4c3cd;stroke-width:7;stroke-linecap:round}
.edge.cut{stroke:#e5ecef;stroke-width:4;stroke-dasharray:6 8}
.edge-hit{stroke:transparent;stroke-width:26;stroke-linecap:round}
.node{stroke:#fff;stroke-width:4}
.node.s{fill:#ffd96f}.node.r.on{fill:var(--red)}.node.r.off{fill:#f3c5c8}.node.b.on{fill:var(--blue)}.node.b.off{fill:#d6e8f3}.node.n.on{fill:#5c8797}.node.n.off{fill:#d3dee2}
.nlabel{font-size:13px;font-weight:900;fill:white;text-anchor:middle;dominant-baseline:middle}
.nname{font-size:10px;font-weight:800;fill:#8ea5ad;text-anchor:middle}
.cutguide{display:flex;gap:9px;align-items:center;padding:11px 12px;border-radius:13px;background:#f3fafb;font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.scissor{font-size:20px;color:var(--cyan2)}
.tiles-wrap{padding-top:8px}
.tiles{display:grid;gap:6px;min-height:72px;align-items:stretch}
.tile{background:#f7fbfc;border:1px solid #dcebef;border-radius:14px;display:grid;place-items:center;min-height:66px;font-size:28px;font-weight:900;letter-spacing:-.06em;transition:transform .16s ease, background .16s ease, box-shadow .16s ease}
.tile.mark{background:#eaf8fa;border-color:#bbe5ec;box-shadow:0 0 0 3px rgba(0,169,192,.1) inset}
.targetrow{display:grid;gap:6px;margin-top:9px}
.targetcell{min-height:32px;border-radius:10px;background:#f5fafb;border:1px dashed #d7e8eb;display:grid;place-items:center;font-size:12px;font-weight:800;color:#8ca4ac}
.triad-controls{display:grid;gap:10px;margin-top:12px}
.group{background:#fbfeff;border:1px solid #e8f0f2;border-radius:15px;padding:10px 10px 11px}
.group-top{font-size:11px;font-weight:800;color:#8fa5ad;margin-bottom:6px}
.group-preview{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:16px;font-weight:900;margin-bottom:9px}
.group-preview .mini{display:flex;gap:4px;align-items:center}
.mtile{min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:#f0f8fa;display:grid;place-items:center}
.group button{width:100%;min-height:42px;border-radius:12px;background:#eaf8fa;color:var(--cyan2);font-weight:900;border:1px solid #d5eef2}
.group button:active{transform:scale(.985)}
.success{background:var(--okp);border:1px solid #cbeee6;padding:16px;border-radius:17px;text-align:center;margin-top:12px}
.success strong{display:block;font-size:24px;line-height:1.3;margin-bottom:6px;color:var(--ok)}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0 0}.dot{width:7px;height:7px;background:#d8e7eb;border-radius:999px}.dot.on{width:24px;background:var(--cyan)}
.overlay{position:fixed;inset:0;background:rgba(16,36,45,.44);display:grid;place-items:center;padding:18px;z-index:50}
.dialog{max-width:430px;width:100%;background:white;border-radius:24px;padding:18px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.15)}
.dialog h2{font-size:22px;letter-spacing:-.05em;line-height:1.3;margin:5px 0 8px}.dialog p{font-size:13px;line-height:1.75;color:var(--sub);margin:0 0 10px}.dialog .demo{padding:12px;border-radius:14px;background:#f3fafb;font-size:12px;line-height:1.75;color:var(--ink);margin-bottom:12px}
.dialog .demo strong{color:var(--cyan2)}
.dialog button{width:100%;min-height:46px;background:var(--cyan);color:white;border-radius:14px;font-weight:900}
.hidden{display:none!important}
@keyframes fade{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (max-width:360px){.shell{padding-left:12px;padding-right:12px}.title{font-size:22px}.logo{font-size:20px}.hero h1{font-size:25px}.tile{min-height:58px;font-size:24px}.menu-illust{width:74px;height:74px}}

/* UI v4: one uninterrupted interactive board */
.unified-title{display:flex;align-items:center;gap:11px;margin:0 0 10px}
.unified-title h3{font-size:16px;letter-spacing:-.035em;margin:0}
.unified-title small{display:block;font-size:11px;color:var(--sub);line-height:1.5;margin-top:3px}
.scanboard{max-width:414px;margin:8px auto 4px;touch-action:none;user-select:none;-webkit-user-select:none}
.scanboard .scan-area{width:100%;max-width:none;grid-template-columns:37px 1fr;grid-template-rows:37px 1fr;gap:7px}
.scanboard .scan-top,.scanboard .scan-side{gap:5px}
.scanboard .probe{border-radius:12px;background:#edf9fb;color:var(--cyan2);border:1px solid #d3e9ed;min-height:36px;min-width:0;font-size:16px;touch-action:manipulation;transition:transform .15s,background .2s}
.scanboard .probe:active{transform:scale(.92)}
.scanboard .probe.used{background:var(--cyan);color:white;border-color:var(--cyan);font-size:19px}
.scanboard .probe.prompt{animation:pulsehalo 1.8s ease-in-out infinite}
.scanboard .answergrid{aspect-ratio:1;border:2px solid #d4e7eb;border-radius:18px;box-shadow:0 10px 26px rgba(28,105,128,.055);background:white}
.scanboard .scan-cell{display:grid;place-items:center;position:relative;background:white;touch-action:none;border-right:1px solid #e8f0f2;border-bottom:1px solid #e8f0f2}
.scanboard .scan-cell i{display:block;width:75%;height:75%;border-radius:10px;background:transparent;transition:background .12s,box-shadow .12s}
.scanboard .scan-cell.on i{background:linear-gradient(145deg,#16bed2,#0298b0);box-shadow:inset 0 2px 5px rgba(255,255,255,.22),0 2px 4px rgba(0,155,177,.14)}
.scanboard .scan-cell.on::after{content:'';display:block;position:absolute;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.85);box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.scanboard .scan-cell:active{background:#f0fbfc}
.scan-shape{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:5px}
.scan-shape .sample-grid{flex:none;width:58px;height:58px}
.scan-shape .shape-caption{font-size:11px;color:var(--sub);line-height:1.6;flex:1}
.scan-shape .shape-caption strong{font-size:13px;color:var(--ink)}
.board-hint{text-align:center;font-size:11px;color:#8aa3ad;line-height:1.5;margin:10px 0}
.checkarea{display:flex;gap:9px;margin-top:16px}
.checkarea button{min-height:49px}
.triad-play{position:relative;overflow:visible}
.triad-btn-strip{position:relative;height:89px;margin:19px 0 7px}
.triad-choice{position:absolute;top:0;display:flex;align-items:center;flex-direction:column;gap:4px;transform:translateX(-50%);width:48px}
.triad-choice .range{font-size:10px;line-height:1;font-weight:750;color:#8da8b1;white-space:nowrap}
.triad-choice button{border:1px solid #b8e7ef;color:var(--cyan2);font-size:26px;font-weight:850;background:#eaf9fb;border-radius:14px;width:46px;height:50px;display:grid;place-items:center;box-shadow:0 3px 9px rgba(30,127,150,.06);transition:background .12s,transform .12s}
.triad-choice button:active{transform:scale(.94);background:#cbf0f5}
.triad-choice.selected button{background:var(--cyan);color:white}
.triad-range{height:5px;position:absolute;top:-10px;border-radius:8px;background:var(--cyan);opacity:0;pointer-events:none;transition:opacity .14s}
.triad-range.on{opacity:1}
.tile{will-change:transform;position:relative;z-index:1}
.tile.spotlight{border-color:#7ad5e1;background:#e9f9fb;box-shadow:0 0 0 3px #d5f3f7}
.tile.motion{z-index:3}
.triad-copy{font-size:12px;color:var(--sub);text-align:center;line-height:1.7;margin:8px 0 0}
.triad-targets{display:flex;align-items:center;gap:8px;margin-top:13px;font-size:11px;color:var(--soft)}
.triad-targets .targetrow{flex:1;margin:0}
.triad-targets b{font-size:10px;color:var(--cyan2)}
.cut-elite{border:1px solid #cae6ed;border-radius:15px;padding:12px;background:linear-gradient(110deg,#effcfd,#fff);margin:0 0 13px}
.cut-elite strong{font-size:12px;color:var(--cyan2);letter-spacing:.05em}
.cut-elite p{font-size:12px;color:var(--ink);line-height:1.55;margin:4px 0 0}
.cut-strokeline{stroke:#04adc5;stroke-width:4;stroke-linecap:round;stroke-dasharray:4 4;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,168,192,.3))}
.cut-board{touch-action:none!important}
.cutboard-caption{text-align:center;font-size:11px;line-height:1.7;color:var(--sub);margin-top:9px}
.fadegame{opacity:.68;pointer-events:none}
@keyframes pulsehalo{0%,100%{box-shadow:0 0 0 2px rgba(0,169,192,.10)}50%{box-shadow:0 0 0 6px rgba(0,169,192,.20)}}
@media (prefers-reduced-motion:reduce){.probe.prompt{animation:none}}
.research-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:17px 2px 11px}.research-heading span{font-size:10px;letter-spacing:.14em;color:#0c9a9f;font-weight:900}.research-heading strong{font-size:14px;color:#244a56;letter-spacing:-.025em}.research-link{display:flex;align-items:center;gap:12px;margin:9px 0;padding:15px 13px;border-radius:17px;border:1px solid #d7e8e6;background:#fff;text-decoration:none;color:#1f4350;box-shadow:0 5px 20px rgba(30,80,81,.04)}.research-number{height:52px;width:52px;display:grid;place-items:center;border-radius:14px;font-size:20px;font-weight:900;flex:none}.research-number.ribbon{background:#e6f4f0;color:#087e7b}.research-number.checksum{background:#162f48;color:#9eddd3}.research-text{flex:1;display:flex;flex-direction:column;min-width:0;gap:4px}.research-text b{font-size:15px;letter-spacing:-.035em}.research-text small{font-size:11px;line-height:1.5;color:#708c96}.research-arr{font-size:21px;color:#0e9baa}.research-caption{text-align:center;font-size:10px;line-height:1.65;color:#91a7af;margin:10px 8px 2px}
</style>
</head>

<div class="shell">
  <div class="top">
    <div class="brand"><div class="over">EXPERIMENT / 2026.11.07</div><div class="logo">MATH MECHANICS</div></div>
    <button id="soundBtn" class="iconbtn" aria-label="音のオンオフ">♫</button>
  </div>
  <div id="app"></div>
</div>
<script>
(()=>{
'use strict';
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const storeKey='math_mechanics_lab_ui_v3';
let prefs={sound:true,page:'home',game:'scan',levels:{scan:0,cut:0,triad:0}};
try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem(storeKey)||'{}'));prefs.levels=Object.assign({scan:0,cut:0,triad:0},prefs.levels||{})}catch{}
let page=prefs.page||'home', game=prefs.game||'scan', sound=prefs.sound!==false, levels=prefs.levels;

const app=$('#app');
const scanDefs=[
 {n:3,shape:[[0,0],[0,1],[1,0],[1,1]],rot:false,target:3,cap:2,title:'かくれた四角を見つけよう',sub:'矢印で数を調べ、そのままマスを塗って形を見つけよう。'},
 {n:4,shape:[[0,0],[0,1],[1,0],[1,1]],rot:false,target:6,cap:4,title:'9か所のどこ？',sub:'同じ盤面の上で、調べながら形を描こう。'},
 {n:4,shape:[[0,0],[1,0],[2,0],[2,1]],rot:true,target:17,cap:4,title:'L字の向きも考える',sub:'今度はL字。場所だけでなく向きも変わる。'},

];
const cutDefs=[

function scanCandidates(d){
  let shapes=[], cur=d.shape;
  for(let i=0;i<(d.rot?4:1);i++){shapes.push(normalize(cur));cur=cur.map(([y,x])=>[x,-y])}
  let seen=new Set(), out=[];
  for(const shp of shapes){const h=Math.max(...shp.map(v=>v[0]))+1, w=Math.max(...shp.map(v=>v[1]))+1; for(let dy=0;dy<=d.n-h;dy++)for(let dx=0;dx<=d.n-w;dx++){const coords=shp.map(([y,x])=>[y+dy,x+dx]); const key=coords.map(v=>v.join(',')).sort().join('|'); if(!seen.has(key)){seen.add(key); out.push(coords)}}}
  return out.sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
}

function bindScan(){
  const d=scanDefs[levels.scan];
  $$('[data-scan]',app).forEach(b=>b.onclick=()=>{if(board.won||board.used.length>=d.cap)return;const [ax,iStr]=b.dataset.scan.split(':'),i=+iStr;if(board.used.some(u=>u.ax===ax&&u.i===i))return;const count=countIn(board.secret,ax,i);board.remain=board.remain.filter(s=>countIn(s,ax,i)===count);board.used.push({ax,i,count});board.feedback=null;beep();render()});
  const grid=$('#paintGrid'); let dragging=false, drawValue=true, drawn=new Set();
  const apply=(el)=>{if(!el||!el.classList||!el.classList.contains('scan-cell')||board.won)return;
    const key=el.dataset.cell;if(drawn.has(key))return;drawn.add(key);
    if(drawValue) board.guess.add(key);else board.guess.delete(key);
    el.classList.toggle('on',drawValue);el.setAttribute('aria-pressed',String(drawValue));board.feedback=null;
  };
  grid.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-cell]');if(!el||board.won)return;drawValue=!board.guess.has(el.dataset.cell);dragging=true;drawn.clear();apply(el);beep();grid.setPointerCapture?.(e.pointerId);e.preventDefault()});
  grid.addEventListener('pointermove',e=>{if(!dragging)return;const el=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-cell]');if(el&&grid.contains(el))apply(el);e.preventDefault()});
  const finish=()=>{if(!dragging)return;dragging=false;drawn.clear();render()};
  grid.addEventListener('pointerup',finish);grid.addEventListener('pointercancel',finish);grid.addEventListener('lostpointercapture',()=>{if(dragging)finish()});
  grid.addEventListener('keydown',e=>{const el=e.target.closest('[data-cell]');if(el&&(e.key==='Enter'||e.key===' ')){drawValue=!board.guess.has(el.dataset.cell);drawn.clear();apply(el);beep();render();e.preventDefault()}});
  $('#clearGuessBtn').onclick=()=>{board.guess.clear();board.feedback=null;beep();render()};
  $('#checkGuessBtn').onclick=()=>{const guess=[...board.guess].map(s=>s.split(',').map(Number));if(shapeKey(guess)===shapeKey(board.secret)){board.won=true;board.feedback='ok';beep('win')}else{board.feedback='wrong';beep()}render()};
}
function bindCut(){
  $('#undoCutBtn').onclick=()=>{if(!board.history.length)return;board.cuts=board.history.pop();board.won=false;board.feedback=null;beep();render()};
  $('#resetCutBtn').onclick=()=>{board.cuts.clear();board.history=[];board.won=false;board.feedback=null;beep();render()};
  const svg=$('#cutSvg'), d=cutDefs[levels.cut],blade=$('#cutStrokeline');
  const edges=d.edges.map(([a,b],i)=>({i,p:{x:d.nodes[a][0]*400,y:d.nodes[a][1]*300},q:{x:d.nodes[b][0]*400,y:d.nodes[b][1]*300}}));
  let tracking=false,start=null,current=null,pid=null;
  const point=e=>{const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const mat=svg.getScreenCTM();return mat?pt.matrixTransform(mat.inverse()):{x:0,y:0}};
  const cross=(a,b,c,d)=>{const rx=b.x-a.x,ry=b.y-a.y,sx=d.x-c.x,sy=d.y-c.y,det=rx*sy-ry*sx;if(Math.abs(det)<1e-8)return false;const ux=c.x-a.x,uy=c.y-a.y,t=(ux*sy-uy*sx)/det,u=(ux*ry-uy*rx)/det;return t>0&&t<1&&u>.12&&u<.88};
  svg.addEventListener('pointerdown',e=>{if(board.won||tracking)return;tracking=true;pid=e.pointerId;start=point(e);current=start;blade.setAttribute('x1',start.x);blade.setAttribute('y1',start.y);blade.setAttribute('x2',start.x);blade.setAttribute('y2',start.y);blade.style.opacity='1';svg.setPointerCapture?.(pid);e.preventDefault()});
  svg.addEventListener('pointermove',e=>{if(!tracking||e.pointerId!==pid)return;current=point(e);blade.setAttribute('x2',current.x);blade.setAttribute('y2',current.y);e.preventDefault()});
  const end=e=>{if(!tracking||e.pointerId!==pid)return;tracking=false;blade.style.opacity='0';const finish=point(e);const distance=Math.hypot(finish.x-start.x,finish.y-start.y);if(e.type==='pointercancel'||distance<18)return;
    const intersect=edges.find(x=>!board.cuts.has(x.i)&&cross(start,finish,x.p,x.q));
    if(!intersect)return;
    if(board.cuts.size>=d.cap){board.feedback='limit';beep();render();return}
    board.history.push(new Set(board.cuts));board.cuts.add(intersect.i);const live=cutPower(d);
    board.won=Object.entries(d.nodes).every(([id,v])=>v[2]==='r'?!live.has(id):v[2]==='b'?live.has(id):true);
    board.feedback=null;beep(board.won?'win':'cut');render();
  };
  svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);
}
function bindTriad(){
  const d=triadDefs[levels.triad];let moving=false;
  $('#undoTriadBtn').onclick=()=>{if(!board.history.length||moving)return;board.arr=board.history.pop();board.lastGroup=null;board.won=false;beep();render()};
  $('#resetTriadBtn').onclick=()=>{if(moving)return;board.arr=d.start.slice();board.history=[];board.lastGroup=null;board.won=false;beep();render()};
  const tiles=$$('#triadTiles .tile',app);
  $$('[data-triad]',app).forEach(btn=>{
    const index=+btn.dataset.triad;
    const show=on=>{tiles.forEach((el,i)=>el.classList.toggle('spotlight',!!on&&i>=index&&i<index+3));btn.parentElement.classList.toggle('selected',!!on)};
    btn.addEventListener('pointerdown',()=>show(true));btn.addEventListener('pointerleave',()=>show(false));btn.addEventListener('pointerup',()=>show(false));
    btn.addEventListener('focus',()=>show(true));btn.addEventListener('blur',()=>show(false));
    btn.addEventListener('click',async()=>{
      if(moving||board.history.length>=d.steps||board.won)return;
      moving=true;const original=board.arr.slice();const triple=tiles.slice(index,index+3);const rects=triple.map(el=>el.getBoundingClientRect());
      const dx1=rects[1].left-rects[0].left,dx2=rects[2].left-rects[1].left,dxBack=rects[0].left-rects[2].left;
      const duration=480;
      beep('rotate');
      const canAnimate=typeof triple[0].animate==='function'&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if(canAnimate){
        const animations=triple.map((el,i)=>{
          el.classList.add('motion');
          const dx=i===0?dx1:i===1?dx2:dxBack;
          const curve=i===2?-16:-3;
          return el.animate([{transform:'translate(0,0) scale(1)',offset:0},{transform:`translate(${dx*.53}px,${curve}px) scale(${i===2?.9:1})`,offset:.53},{transform:`translate(${dx}px,0px) scale(1)`,offset:1}],{duration,easing:'cubic-bezier(.18,.75,.21,1)',fill:'forwards'});
        });
        try{await Promise.all(animations.map(a=>a.finished))}catch{}
        animations.forEach(a=>a.cancel());
      }
      board.history.push(original);const [a,b,c]=original.slice(index,index+3);board.arr.splice(index,3,c,a,b);board.lastGroup=index;
      board.won=board.arr.every((v,j)=>v===j+1);
      moving=false;if(board.won)beep('win');render();
    });
  });
}
$('#soundBtn').onclick=()=>{sound=!sound; save(); soundIcon(); if(sound) beep();};
init(); render();
})();
</script>
