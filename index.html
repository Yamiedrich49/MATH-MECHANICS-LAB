function ping(kind){if(!sound)return;try{audio ||=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const now=audio.currentTime,notes=kind==='win'?[523.25,659.25,783.99,1046.5]:kind==='cut'?[430,330]:kind==='rotate'?[392,523.25]:[620];notes.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=now+i*(kind==='win'?.072:.024),dur=kind==='win'?.55:.12;o.type=i===0?'triangle':'sine';o.frequency.setValueAtTime(hz,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(kind==='win'?.045:.025,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.025)})}catch{}}
function shapeNorm(p){let my=Math.min(...p.map(z=>z[0])),mx=Math.min(...p.map(z=>z[1]));return p.map(([y,x])=>[y-my,x-mx]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function shapeOptions(d){let cur=d.shape,seen=new Set(),out=[];for(let r=0;r<(d.rot?4:1);r++){let p=shapeNorm(cur),h=Math.max(...p.map(x=>x[0]))+1,w=Math.max(...p.map(x=>x[1]))+1;for(let y=0;y<=d.n-h;y++)for(let x=0;x<=d.n-w;x++){let points=p.map(([v,z])=>[v+y,z+x]);let key=points.map(x=>x.join(',')).sort().join('|');if(!seen.has(key)){seen.add(key);out.push(points)}}cur=cur.map(([y,x])=>[x,-y])}return out.sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))}
function countIn(shape,ax,i){return shape.filter(([y,x])=>ax==='r'?y===i:x===i).length}
function reset(){const d=defs[game][levels[game]];if(game==='scan'){let candidates=shapeOptions(d);board={secret:candidates[d.target%candidates.length],remain:candidates,used:[],won:false,failed:false,last:null}}else if(game==='cut')board={cuts:new Set(),won:false,last:null};else board={arr:d.start.slice(),history:[],won:false};lastFlash=-1}
function openGame(g){game=g;page='game';levels[g]=Math.min(Math.max(0,levels[g]),defs[g].length-1);reset();save();ping();render()}
function goStage(dir){levels[game]=Math.min(defs[game].length-1,Math.max(0,levels[game]+dir));reset();save();ping();render()}
function soundButton(){$('#sound').innerHTML=icon(sound?'vol':'mute');$('#sound').setAttribute('aria-label',sound?'音を消す':'音を出す')}
function preview(g){if(g==='scan')return `<svg viewBox="0 0 80 80" aria-hidden="true"><g fill="none" stroke="#c5e4e8" stroke-width="1.5"><path d="M15 14V66M31 14V66M47 14V66M63 14V66M15 14H63M15 30H63M15 46H63M15 62H63"/></g><rect x="31" y="30" width="32" height="32" rx="4" fill="#05afc5" opacity=".24"/><rect x="33" y="32" width="12" height="12" rx="3" fill="#03a8bf"/><rect x="49" y="32" width="12" height="12" rx="3" fill="#03a8bf"/><circle cx="39" cy="9" r="5" fill="#03a8bf"/></svg>`;
if(g==='cut')return `<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M14 40L42 19 65 40 43 63 14 40M42 19 43 63" fill="none" stroke="#96bdc6" stroke-width="4" stroke-linecap="round"/><circle cx="14" cy="40" r="8" fill="#173a49"/><circle cx="42" cy="19" r="9" fill="#03abc0"/><circle cx="65" cy="40" r="9" fill="#ec6f73"/><circle cx="43" cy="63" r="8" fill="#ec6f73"/><path d="m52 28 8 7" stroke="white" stroke-width="3" stroke-linecap="round"/></svg>`;
return `<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="7" y="24" width="21" height="31" rx="6" fill="#b7e9ef"/><rect x="30" y="24" width="21" height="31" rx="6" fill="#06acc2"/><rect x="53" y="24" width="21" height="31" rx="6" fill="#b7e9ef"/><g fill="#164457" font-size="18" font-weight="800" text-anchor="middle"><text x="17.5" y="45">2</text><text x="40.5" y="45" fill="white">3</text><text x="63.5" y="45">1</text></g><path d="M25 16a19 19 0 0 1 31 0" fill="none" stroke="#02a8bf" stroke-width="2.5" stroke-linecap="round"/><path d="m52 11 5 5-7 1" fill="none" stroke="#02a8bf" stroke-width="2.5" stroke-linecap="round"/></svg>`}
function home(){app.innerHTML=`<div class="page"><div class="eyebrow">THINK • TOUCH • DISCOVER</div><h1 class="intro-title">考えるって、<br>面白い。</h1><p class="intro-body">3つの数学パズルを遊び比べる、小さな研究所。<br>気になるゲームを選んで、指で触ってみよう。</p>${['scan','cut','triad'].map((g,i)=>`<button class="game-card" data-open="${g}"><span class="visual">${preview(g)}</span><span class="card-content"><span class="num">EXPERIMENT 0${i+1} · ${defs[g].length} STAGES</span><div class="card-name">${names[g]}</div><p class="card-desc">${subtitles[g]}</p><div class="card-extra">${['タテ・ヨコの矢印をタップ','線をタップして切断','↻をタップして3枚を回す'][i]}</div></span><span class="card-arrow">›</span></button>`).join('')}<div class="home-foot">音は右上で切り替えられます。進み具合はこの端末に保存。</div></div>`;
app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGame(b.dataset.open))}
function header(d){let no=levels[game]+1;return `<div class="topnav"><button class="back" id="back">${icon('back')} すべてのゲーム</button><span class="nav-sep">/</span><span class="nav-name">${names[game]}</span></div><main class="panel"><div class="game-head"><span class="stage-name">LEVEL ${String(no).padStart(2,'0')} / ${String(defs[game].length).padStart(2,'0')}</span><button class="help-btn" id="help">？ あそびかた</button></div><h1 class="main-title">${d.title}</h1><p class="mission"><span class="mission-mark">✓</span><span>${d.mission}</span></p>`}
function hintText(){if(game==='scan')return `まずは<b>左はしの↓</b>をタップ！ そのタテ列・ヨコ行に隠れたマスが何個あるか分かるよ。`;if(game==='cut')return `まずは<b>道の線をタップ</b>して切ってみよう。赤は消して、青は消さないで。`;return `まずは<b>↻をタップ</b>。その真上の3枚が、右に1つずつ動くよ。`}
function helpHtml(){return `<div class="hint show">${icon('light')}<div>${hintText()}</div></div>`}
function scan(){const d=defs.scan[levels.scan],n=d.n,remain=board.remain;let cert=remain.length===1,used=board.used.length;let probs=Array(n*n).fill(0);for(const s of remain)for(const [r,c] of s)probs[r*n+c]++;const xbtn=Array.from({length:n},(_,i)=>{let q=board.used.find(v=>v.ax==='c'&&v.i===i);return `<button class="scan-trigger ${!used&&i===0?'prompt':''}" data-scan="c:${i}" data-used="${q?1:0}" ${q||cert||board.failed?'disabled':''} aria-label="${i+1}列目をスキャン">${q?q.count:'↓'}</button>`}).join(''),ybtn=Array.from({length:n},(_,i)=>{let q=board.used.find(v=>v.ax==='r'&&v.i===i);return `<button class="scan-trigger" data-scan="r:${i}" data-used="${q?1:0}" ${q||cert||board.failed?'disabled':''} aria-label="${i+1}行目をスキャン">${q?q.count:'→'}</button>`}).join(''),cells=probs.map((x,i)=>`<div class="scan-cell ${cert&&x?'sure':''} ${cert&&!x?'no':''}" style="--op:${cert?'0':used?Math.max(.04,.66*x/remain.length).toFixed(2):0}"></div>`).join('');let shape=d.shape,tw=Math.max(...shape.map(x=>x[1]))+1,th=Math.max(...shape.map(x=>x[0]))+1;let pic=`<div class="shape-pic" style="grid-template-columns:repeat(${tw},14px);grid-template-rows:repeat(${th},14px)">${Array.from({length:th*tw},(_,k)=>`<i class="${shape.some(([y,x])=>y===Math.floor(k/tw)&&x===k%tw)?'on':''}"></i>`).join('')}</div>`;
return `${used===0?helpHtml():''}<div class="scan-primer">${pic}<p><strong>隠れている形</strong>${d.rot?'向きが変わっているかも':'この形がどこかにあるよ'}。場所はまだ分からない。</p></div><div class="challenge-header"><span class="challenge-label">見つかるまで、あと何通り？</span><span class="metric">候補 ${remain.length} 通り</span></div><div class="scan-wrap" style="--count:${n}"><div class="scan-corner">タップ<br>して調べる</div><div class="scan-x">${xbtn}</div><div class="scan-y">${ybtn}</div><div class="scan-grid">${cells}</div></div><div class="scan-legend">${!used?'上の↓か左の→で、気になる列を調べよう':cert?'すべての手がかりがつながって、形が見えた！':'色が濃いマスほど、そこに形がある候補が多いよ'}</div><div class="feedback ${board.failed?'warn':board.last?'strong':''}"><span>${board.failed?'回数を使い切ったよ。もう一度考えよう。':board.last?`${board.last.ax==='c'?'タテ':'ヨコ'}に ${board.last.count} マス！ ${board.last.before}通り → ${remain.length}通り`:'調べた列・行には数字が表示されるよ'}</span><strong>残り ${d.cap-used} 回</strong></div>`}
function power(d){let adj={};d.edges.forEach(([a,b],i)=>{if(board.cuts.has(i))return;(adj[a]??=[]).push(b);(adj[b]??=[]).push(a)});let seen=new Set(['S']),stack=['S'];while(stack.length){let a=stack.pop();for(let b of adj[a]||[])if(!seen.has(b)){seen.add(b);stack.push(b)}}return seen}
function cut(){const d=defs.cut[levels.cut],live=power(d);const red=Object.entries(d.nodes).filter(([_,x])=>x[2]==='r'),blue=Object.entries(d.nodes).filter(([_,x])=>x[2]==='b'),off=red.filter(([k])=>!live.has(k)).length,blueSafe=blue.every(([k])=>live.has(k)),ncut=board.cuts.size;let edges=d.edges.map(([a,b],i)=>{let p=d.nodes[a],q=d.nodes[b],x1=p[0]*400,y1=p[1]*320,x2=q[0]*400,y2=q[1]*320,isOff=board.cuts.has(i),cx=(x1+x2)/2,cy=(y1+y2)/2;return `<g data-edge="${i}" role="button" aria-label="線${i+1}を${isOff?'つなぐ':'切る'}"><line class="wire ${isOff?'off':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><circle class="edge-pip ${isOff?'off':''}" cx="${cx}" cy="${cy}" r="${isOff?7:4}"/><line class="wire-hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/></g>`}).join('');let nodes=Object.entries(d.nodes).map(([id,[x,y,type]])=>{let xx=x*400,yy=y*320,on=live.has(id),c=type==='r'?'#ed7479':type==='b'?'#04aac0':type==='s'?'#194356':'#9dc3cb',label=type==='r'?'赤':type==='b'?'青':type==='s'?'電源':'';return `<g class="lamp" opacity="${on?1:.60}"><circle cx="${xx}" cy="${yy}" r="${type==='n'?11:21}" fill="${on?c:'#d9e5e9'}" stroke="#ffffff" stroke-width="3.2"/><circle cx="${xx}" cy="${yy}" r="${type==='n'?3:6}" fill="#fff" opacity="${on?.9:.45}"/><text class="node-caption" x="${xx}" y="${yy+36}">${label}${type==='r'&&!on?' ✓':type==='b'&&!on?' !':''}</text></g>`}).join('');const msg=board.last==='limit'?'これ以上は切れない。別の線をつなぎ直そう。':!blueSafe?'青いランプが消えちゃった！ 線を戻して守ろう。':board.last===null?'線をタップすると切れます。もう一度タップで戻せます。':`${off}個の赤いランプが消えた。次はどこを切る？`;
return `${ncut===0?helpHtml():''}<div class="goals"><div class="goal"><span class="signal red"></span><span>赤は全部消す<br><span class="red-text">${off} / ${red.length} 消灯</span></span></div><div class="goal"><span class="signal blue"></span><span>青は守る<br><span class="cyan-text">${blueSafe?'点灯中 ✓':'消灯中 ✕'}</span></span></div></div><div class="challenge-header"><span class="challenge-label">線を切った数</span><span class="metric ${ncut>=d.cap?'red':''}">${ncut} / ${d.cap} 本</span></div><svg class="diagram" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" aria-label="電源から伸びる線と、赤青ランプの図">${edges}${nodes}</svg><div class="cut-msg">${msg}</div>`}
function triad(){let d=defs.triad[levels.triad],n=board.arr.length,steps=board.history.length,cols=`repeat(${n},minmax(0,1fr))`;let tiles=board.arr.map((v,i)=>`<div class="triad-tile ${v===i+1?'correct':'shade'} ${lastFlash===i?'flash':''}">${v}</div>`).join('');let target=board.arr.map((_,i)=>`<div class="target">${i+1}</div>`).join('');let moves=Array.from({length:n-2},(_,i)=>`<div class="triad-btn-wrap" style="grid-column:${i+1}/span 3;grid-row:1;justify-self:center"><button class="triad-btn ${i===0&&steps===0&&levels.triad===0?'feature':''}" data-triad="${i}" aria-label="${i+1}枚目から3枚を右に回転" ${steps>=d.steps||board.won?'disabled':''}>↻</button>${i===0&&steps===0&&levels.triad===0?'<small>ここを押してみよう</small>':''}</div>`).join('');return `${steps===0?helpHtml():''}<div class="challenge-header"><span class="challenge-label">目標：1から順番に並べる</span><span class="metric">${steps} / ${d.steps} 手</span></div><div class="triad-work"><div class="triad-caption"><span>いまの並び</span><span>数字をタップするのではなく、↻で回すよ</span></div><div class="triad-row" style="grid-template-columns:${cols}">${tiles}</div><div class="target-row" style="grid-template-columns:${cols}">${target}</div><div class="triad-caption"><span>▲ 上が数字／下が目標の位置</span></div><div class="triad-arrows" style="--n:${n}">${moves}</div></div><div class="triad-step">${steps>=d.steps&&!board.won?'手数がなくなった。1手もどしてみよう。':'↻を押すと、その真上にある3枚が右へ1つずつ動く'}</div>${steps&&!board.won?`<div style="display:flex;justify-content:center;margin:7px 0 0"><button class="undo" id="undo">↶ 1手もどす</button></div>`:''}`}
function success(){let more=levels[game]+1<defs[game].length;return `<div class="success ${more?'':'last'}"><div class="success-icon">${icon('check')}</div><h2>できた！</h2><p>${game==='scan'?'少ない手がかりで、隠れた形を見つけた！':game==='cut'?'赤だけ消して、青を守れた！':'3枚ずつ回して、数字を順番に戻せた！'}</p><button class="next" id="next">${more?'次のステージへ →':'3ゲームの一覧へ →'}</button></div>`}
function footer(){return `<div class="bottom"><button class="plain-btn" id="prev" ${levels[game]===0?'disabled':''}>← 前へ</button><button class="plain-btn" id="restart">${icon('refresh')} やり直す</button><button class="plain-btn" id="forward" ${levels[game]===defs[game].length-1?'disabled':''}>次へ →</button></div><div class="progress">${defs[game].map((_,i)=>`<span class="${i===levels[game]?'active':''} ${i<levels[game]?'complete':''}"></span>`).join('')}</div></main><div class="micro">RESEARCH BUILD 02 — まず、仕組みを楽しく理解できるか。</div>`}
function dialog(){if(!help)return;let data=game==='scan'?['隠れた形を見つけよう','タテの↓、ヨコの→をタップすると、その列に隠れたマスが何個あるかが数字で現れます。分かった数から候補を絞り、最後の1通りを見つけよう。','↓ をタップ → 「2」なら、その列に2マス隠れている']:game==='cut'?['赤だけ消そう','電源から線をたどって、赤いランプをすべて消そう。青いランプは点いたままにしてね。線をタップして切り、もう一度タップすると元に戻せます。','赤＝消す　・　青＝守る　・　線をタップ＝切る']:['3枚ずつ回そう','↻ボタンを押すと、その真上の3枚が右に1マスずつずれます。数字を1、2、3…の順に並べよう。3枚のまとまりを見つけるのがコツ。','2 ｜ 3 ｜ 1　　↻　　1 ｜ 2 ｜ 3'];document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="modal"><div class="dialog" role="dialog" aria-modal="true" aria-label="あそびかた"><div class="eyebrow">HOW TO PLAY</div><h2>${data[0]}</h2><p>${data[1]}</p><div class="dialog-demo">${data[2]}</div><button id="closeHelp">わかった！遊んでみる</button></div></div>`);$('#closeHelp').onclick=()=>{help=false;$('#modal').remove()};$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'){help=false;$('#modal').remove()}})}
function render(){soundButton();if(page==='home'){home();return}let d=defs[game][levels[game]];app.innerHTML=`<div class="page">${header(d)}${game==='scan'?scan():game==='cut'?cut():triad()}${board.won?success():''}${footer()}</div>`;
$('#back').onclick=()=>{page='home';ping();render()};$('#help').onclick=()=>{help=true;dialog()};$('#prev').onclick=()=>goStage(-1);$('#forward').onclick=()=>goStage(1);$('#restart').onclick=()=>{ping();reset();render()};$('#next')?.addEventListener('click',()=>{if(levels[game]===defs[game].length-1){page='home';render()}else goStage(1)});$('#undo')?.addEventListener('click',()=>{board.arr=board.history.pop();board.won=false;ping('rotate');render()});
app.querySelectorAll('[data-scan]').forEach(b=>b.onclick=()=>{let [ax,index]=b.dataset.scan.split(':'),i=+index,d=defs.scan[levels.scan];if(board.won||board.failed||board.used.length>=d.cap)return;let count=countIn(board.secret,ax,i),before=board.remain.length;board.remain=board.remain.filter(s=>countIn(s,ax,i)===count);board.used.push({ax,i,count});board.last={ax,count,before};board.won=board.remain.length===1;board.failed=!board.won&&board.used.length===d.cap;ping(board.won?'win':'tap');render()});
app.querySelectorAll('[data-edge]').forEach(b=>b.addEventListener('click',()=>{if(board.won)return;let i=+b.dataset.edge,d=defs.cut[levels.cut];if(board.cuts.has(i))board.cuts.delete(i);else{if(board.cuts.size>=d.cap){board.last='limit';ping();render();return}board.cuts.add(i)}const live=power(d);board.won=Object.entries(d.nodes).every(([id,x])=>x[2]==='r'?!live.has(id):x[2]==='b'?live.has(id):true);board.last=i;ping(board.won?'win':'cut');render()}));
app.querySelectorAll('[data-triad]').forEach(b=>b.onclick=()=>{let i=+b.dataset.triad,d=defs.triad[levels.triad];if(board.won||board.history.length>=d.steps)return;board.history.push(board.arr.slice());let [a,c,e]=board.arr.slice(i,i+3);board.arr.splice(i,3,e,a,c);lastFlash=i+1;board.won=board.arr.every((v,j)=>v===j+1);ping(board.won?'win':'rotate');render()})}
$('#sound').onclick=()=>{sound=!sound;save();soundButton();if(sound)ping()};if(prefs.stages)for(let g of ['scan','cut','triad']){let n=Number(prefs.stages[g]);if(Number.isInteger(n))levels[g]=Math.min(Math.max(n,0),defs[g].length-1)}render();
})();
</script></body></html>
