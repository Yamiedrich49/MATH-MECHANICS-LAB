<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f7fbfc">
<title>MATH MECHANICS LAB UI v3</title>
<style>
:root{--bg:#f7fbfc;--card:#ffffff;--ink:#173746;--sub:#69818b;--soft:#95acb4;--line:#dbe8ec;--cyan:#00a9c0;--cyan2:#0c8ea2;--pale:#eaf8fa;--red:#eb6b71;--redp:#fff0f0;--blue:#1ea7d0;--bluep:#eef8ff;--ok:#159a8a;--okp:#ecfbf7;--shadow:0 8px 22px rgba(17,60,75,.06);--radius:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;overscroll-behavior-y:none}
body{min-height:100svh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible{outline:3px solid #88e6f2;outline-offset:2px}
.shell{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{flex:1}
.over{font-size:10px;font-weight:900;letter-spacing:.22em;color:var(--cyan2)}
.logo{font-size:22px;font-weight:900;letter-spacing:-.05em;line-height:1.2;margin-top:4px}
.iconbtn{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow)}
.page{animation:fade .18s ease-out}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.hero{padding:18px 18px 16px;margin-bottom:14px}
.hero h1{font-size:28px;line-height:1.28;letter-spacing:-.06em;margin:4px 0 8px}
.hero p{font-size:13px;line-height:1.75;color:var(--sub);margin:0}
.menu-item{display:flex;gap:14px;align-items:center;padding:16px;margin:12px 0;text-align:left;width:100%}
.menu-illust{width:84px;height:84px;border-radius:18px;background:#eef9fb;display:grid;place-items:center;flex:none}
.menu-body{flex:1;min-width:0}
.menu-no{font-size:10px;color:var(--cyan2);font-weight:900;letter-spacing:.14em}
.menu-name{font-size:18px;font-weight:900;letter-spacing:-.04em;margin:3px 0}
.menu-desc{font-size:12px;line-height:1.65;color:var(--sub)}
.menu-tip{font-size:11px;line-height:1.55;color:#97acb4;margin-top:4px}
.arrow{font-size:24px;color:var(--cyan)}
.small{font-size:11px;color:#96acb4;line-height:1.7;text-align:center;margin:18px 8px 0}
.header{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.back{width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.header-main{flex:1;min-width:0}
.label{font-size:10px;font-weight:900;letter-spacing:.15em;color:var(--cyan2)}
.title{font-size:24px;font-weight:900;letter-spacing:-.055em;line-height:1.25;margin:5px 0 6px}
.sub{font-size:13px;line-height:1.7;color:var(--sub);margin:0}
.row{display:flex;gap:10px}
.toptools{display:flex;gap:8px;align-self:flex-start}
.chipbtn{height:40px;padding:0 12px;border:1px solid var(--line);background:var(--card);border-radius:13px;display:grid;place-items:center;box-shadow:var(--shadow);font-weight:800;font-size:12px;color:var(--ink)}
.stagebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 13px;margin:14px 0 12px;box-shadow:var(--shadow)}
.stagebar strong{font-size:13px}
.stagebar span{font-size:12px;color:var(--cyan2);font-weight:900}
.boardcard{padding:16px;margin-bottom:12px}
.section{padding:14px;border-radius:17px;background:#fbfeff;border:1px solid #e9f0f2;margin-bottom:12px}
.section:last-child{margin-bottom:0}
.step{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--cyan2);margin-bottom:6px}
.section h3{font-size:18px;letter-spacing:-.04em;line-height:1.3;margin:0 0 6px}
.section p{font-size:12px;color:var(--sub);line-height:1.65;margin:0 0 10px}
.notice{font-size:12px;color:var(--sub);line-height:1.6;background:#f3fafb;border-radius:12px;padding:10px 12px}
.meter{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.badge{padding:7px 10px;border-radius:999px;background:#eff8fa;color:var(--cyan2);font-weight:900;font-size:11px;border:1px solid #d4edf1}
.badge.red{background:var(--redp);color:#c75661;border-color:#f5d4d9}
.badge.blue{background:var(--bluep);color:#317fa4;border-color:#d6ebf8}
.grid-wrap{margin-top:10px}
.scan-area{display:grid;grid-template-columns:30px 1fr;grid-template-rows:30px 1fr;gap:6px;max-width:360px;margin:0 auto}
.scan-top{grid-column:2;display:grid;gap:6px}
.scan-side{grid-row:2;display:grid;gap:6px}
.probe{border-radius:10px;background:#eef8fa;border:1px solid #d7edf1;min-height:30px;font-size:12px;font-weight:900;color:var(--cyan2)}
.probe.used{background:var(--cyan);color:white;border-color:var(--cyan)}
.probe.prompt{box-shadow:0 0 0 3px rgba(0,169,192,.16)}
.answergrid,.heatgrid{display:grid;aspect-ratio:1;border:1px solid var(--line);border-radius:15px;overflow:hidden;background:var(--card)}
.cell{border-right:1px solid #e7eef1;border-bottom:1px solid #e7eef1;display:grid;place-items:center}
.ghost{width:68%;height:68%;border-radius:7px;background:var(--cyan)}
.toggle{width:100%;height:100%;background:white}
.toggle.on{background:var(--cyan)}
.toggle.on::after{content:'';display:block;width:68%;height:68%;margin:auto;border-radius:7px;background:white}
.shape-sample{display:flex;justify-content:center;gap:14px;align-items:center;margin:8px 0 2px}
.sample-grid{display:grid;width:62px;height:62px;border-radius:12px;border:1px solid var(--line);overflow:hidden;background:white}
.sample-grid div{border-right:1px solid #edf2f4;border-bottom:1px solid #edf2f4}
.sample-grid div.on{background:var(--cyan)}
.actions{display:flex;gap:10px;margin-top:12px}
.action{flex:1;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);font-size:13px;font-weight:900}
.action.primary{background:var(--cyan);border-color:var(--cyan);color:white}
.action:disabled{opacity:.42;box-shadow:none}
.feedback{margin-top:10px;padding:11px 12px;border-radius:13px;font-size:12px;line-height:1.6}
.feedback.ok{background:var(--okp);color:var(--ok)}
.feedback.ng{background:#fff5ee;color:#bd6b3f}
.feedback.info{background:#f2fafb;color:var(--sub)}
.svgwrap{background:white;border:1px solid var(--line);border-radius:16px;padding:10px}
svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
.edge{stroke:#a4c3cd;stroke-width:7;stroke-linecap:round}
.edge.cut{stroke:#e5ecef;stroke-width:4;stroke-dasharray:6 8}
.edge-hit{stroke:transparent;stroke-width:26;stroke-linecap:round}
.node{stroke:#fff;stroke-width:4}
.node.s{fill:#ffd96f}.node.r.on{fill:var(--red)}.node.r.off{fill:#f3c5c8}.node.b.on{fill:var(--blue)}.node.b.off{fill:#d6e8f3}.node.n.on{fill:#5c8797}.node.n.off{fill:#d3dee2}
.nlabel{font-size:13px;font-weight:900;fill:white;text-anchor:middle;dominant-baseline:middle}
.nname{font-size:10px;font-weight:800;fill:#8ea5ad;text-anchor:middle}
.cutguide{display:flex;gap:9px;align-items:center;padding:11px 12px;border-radius:13px;background:#f3fafb;font-size:12px;color:var(--sub);line-height:1.6;margin-top:10px}
.scissor{font-size:20px;color:var(--cyan2)}
.tiles-wrap{padding-top:8px}
.tiles{display:grid;gap:6px;min-height:72px;align-items:stretch}
.tile{background:#f7fbfc;border:1px solid #dcebef;border-radius:14px;display:grid;place-items:center;min-height:66px;font-size:28px;font-weight:900;letter-spacing:-.06em;transition:transform .16s ease, background .16s ease, box-shadow .16s ease}
.tile.mark{background:#eaf8fa;border-color:#bbe5ec;box-shadow:0 0 0 3px rgba(0,169,192,.1) inset}
.targetrow{display:grid;gap:6px;margin-top:9px}
.targetcell{min-height:32px;border-radius:10px;background:#f5fafb;border:1px dashed #d7e8eb;display:grid;place-items:center;font-size:12px;font-weight:800;color:#8ca4ac}
.triad-controls{display:grid;gap:10px;margin-top:12px}
.group{background:#fbfeff;border:1px solid #e8f0f2;border-radius:15px;padding:10px 10px 11px}
.group-top{font-size:11px;font-weight:800;color:#8fa5ad;margin-bottom:6px}
.group-preview{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:16px;font-weight:900;margin-bottom:9px}
.group-preview .mini{display:flex;gap:4px;align-items:center}
.mtile{min-width:30px;height:30px;padding:0 6px;border-radius:9px;background:#f0f8fa;display:grid;place-items:center}
.group button{width:100%;min-height:42px;border-radius:12px;background:#eaf8fa;color:var(--cyan2);font-weight:900;border:1px solid #d5eef2}
.group button:active{transform:scale(.985)}
.success{background:var(--okp);border:1px solid #cbeee6;padding:16px;border-radius:17px;text-align:center;margin-top:12px}
.success strong{display:block;font-size:24px;line-height:1.3;margin-bottom:6px;color:var(--ok)}
.dots{display:flex;justify-content:center;gap:7px;margin:16px 0 0}.dot{width:7px;height:7px;background:#d8e7eb;border-radius:999px}.dot.on{width:24px;background:var(--cyan)}
.overlay{position:fixed;inset:0;background:rgba(16,36,45,.44);display:grid;place-items:center;padding:18px;z-index:50}
.dialog{max-width:430px;width:100%;background:white;border-radius:24px;padding:18px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.15)}
.dialog h2{font-size:22px;letter-spacing:-.05em;line-height:1.3;margin:5px 0 8px}.dialog p{font-size:13px;line-height:1.75;color:var(--sub);margin:0 0 10px}.dialog .demo{padding:12px;border-radius:14px;background:#f3fafb;font-size:12px;line-height:1.75;color:var(--ink);margin-bottom:12px}
.dialog .demo strong{color:var(--cyan2)}
.dialog button{width:100%;min-height:46px;background:var(--cyan);color:white;border-radius:14px;font-weight:900}
.hidden{display:none!important}
@keyframes fade{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (max-width:360px){.shell{padding-left:12px;padding-right:12px}.title{font-size:22px}.logo{font-size:20px}.hero h1{font-size:25px}.tile{min-height:58px;font-size:24px}.menu-illust{width:74px;height:74px}}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand"><div class="over">EXPERIMENT / 2026.11.07</div><div class="logo">MATH MECHANICS</div></div>
    <button id="soundBtn" class="iconbtn" aria-label="音のオンオフ">♫</button>
  </div>
  <div id="app"></div>
</div>
<script>
(()=>{
'use strict';
const $=(s,e=document)=>e.querySelector(s);
const $$=(s,e=document)=>[...e.querySelectorAll(s)];
const storeKey='math_mechanics_lab_ui_v3';
let prefs={sound:true,page:'home',game:'scan',levels:{scan:0,cut:0,triad:0}};
try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem(storeKey)||'{}'));prefs.levels=Object.assign({scan:0,cut:0,triad:0},prefs.levels||{})}catch{}
let page=prefs.page||'home', game=prefs.game||'scan', sound=prefs.sound!==false, levels=prefs.levels;
let board={}, audio;
const app=$('#app');
const scanDefs=[
 {n:3,shape:[[0,0],[0,1],[1,0],[1,1]],rot:false,target:3,cap:2,title:'かくれた四角を見つけよう',sub:'まず矢印で行・列を調べよう。数字は「その行・列に、形のマスがいくつあるか」。最後は自分の指で形を置いて答える。'},
 {n:4,shape:[[0,0],[0,1],[1,0],[1,1]],rot:false,target:6,cap:4,title:'9か所のどこ？',sub:'2×2の四角がどこかに隠れている。スキャンで集めた情報から、自分で予想して置こう。'},
 {n:4,shape:[[0,0],[1,0],[2,0],[2,1]],rot:true,target:17,cap:4,title:'L字の向きも考える',sub:'今度はL字。場所だけでなく向きも変わる。'},
 {n:5,shape:[[0,0],[1,0],[2,0],[2,1]],rot:true,target:31,cap:4,title:'48通りからしぼる',sub:'候補はたくさんある。でも調べる回数は4回まで。'}
];
const cutDefs=[
 {title:'1本だけ切ろう',sub:'赤いランプを消し、青いランプは残す。線の上を指でスッとなぞると切れる。',cap:1,nodes:{S:[.11,.53,'s'],A:[.43,.53,'n'],L:[.78,.23,'b'],R:[.80,.78,'r']},edges:[['S','A'],['A','L'],['A','R']]},
 {title:'回り道がある',sub:'1本切っても別の道からつながってしまう。どこを切ればいい？',cap:2,nodes:{S:[.10,.5,'s'],A:[.48,.22,'b'],B:[.48,.78,'b'],R:[.88,.5,'r']},edges:[['S','A'],['S','B'],['A','R'],['B','R']]},
 {title:'3つの赤を2本で',sub:'2本しか切れない。ネットワーク全体を見て急所を探そう。',cap:2,nodes:{S:[.08,.5,'s'],A:[.31,.26,'b'],B:[.31,.74,'b'],H:[.57,.5,'n'],R1:[.83,.16,'r'],R2:[.92,.5,'r'],R3:[.83,.84,'r']},edges:[['S','A'],['S','B'],['A','H'],['B','H'],['H','R1'],['H','R2'],['H','R3']]},
 {title:'青を守りながら切る',sub:'前と同じように見えても、青いランプの位置が変わると正解も変わる。',cap:3,nodes:{S:[.07,.5,'s'],A:[.26,.24,'b'],B:[.26,.76,'b'],H:[.48,.5,'n'],T:[.69,.5,'b'],R1:[.90,.16,'r'],R2:[.92,.5,'r'],R3:[.90,.84,'r']},edges:[['S','A'],['S','B'],['A','H'],['B','H'],['H','T'],['T','R1'],['T','R2'],['T','R3']]}
];
const triadDefs=[
 {start:[2,3,1,4],steps:1,title:'まずは3枚だけ回す',sub:'ボタンの上の3枚が、右へ1マスずつずれる。どの3枚が動くのかを見てから押そう。'},
 {start:[3,1,2,4],steps:2,title:'どの3枚が動く？',sub:'下のプレビューは「押す前 → 押した後」。操作前に結果を予想してみよう。'},
 {start:[4,3,2,1],steps:4,title:'4枚の中で3枚を選ぶ',sub:'1回で変わるのは3枚だけ。動かない1枚にも注目。'},
 {start:[5,4,3,2,1],steps:6,title:'5枚に広げる',sub:'今いる順番と、1手後の順番を見くらべよう。'},
 {start:[6,2,4,3,5,1],steps:7,title:'6枚のからくり',sub:'最初の一手を見通せるかな？'}
];
const defs={scan:scanDefs,cut:cutDefs,triad:triadDefs};

function save(){localStorage.setItem(storeKey,JSON.stringify({sound,page,game,levels}))}
function beep(type='tap'){if(!sound) return; try{audio ||= new (window.AudioContext||window.webkitAudioContext)(); if(audio.state==='suspended') audio.resume(); const now=audio.currentTime; const notes=type==='win'?[523.25,659.25,783.99,1046.5]:type==='cut'?[280,360]:type==='rotate'?[360,480]:[520]; notes.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain(),st=now+i*(type==='win'?0.06:0.01);o.type='sine';o.frequency.setValueAtTime(hz,st);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(type==='win'?0.075:0.04,st+.015);g.gain.exponentialRampToValueAtTime(.0001,st+(type==='win'?0.38:0.09)); o.connect(g).connect(audio.destination); o.start(st); o.stop(st+(type==='win'?0.42:0.1));});}catch(e){}}
function normalize(shape){const minY=Math.min(...shape.map(v=>v[0])), minX=Math.min(...shape.map(v=>v[1])); return shape.map(([y,x])=>[y-minY,x-minX]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);}
function scanCandidates(d){
  let shapes=[], cur=d.shape;
  for(let i=0;i<(d.rot?4:1);i++){shapes.push(normalize(cur));cur=cur.map(([y,x])=>[x,-y])}
  let seen=new Set(), out=[];
  for(const shp of shapes){const h=Math.max(...shp.map(v=>v[0]))+1, w=Math.max(...shp.map(v=>v[1]))+1; for(let dy=0;dy<=d.n-h;dy++)for(let dx=0;dx<=d.n-w;dx++){const coords=shp.map(([y,x])=>[y+dy,x+dx]); const key=coords.map(v=>v.join(',')).sort().join('|'); if(!seen.has(key)){seen.add(key); out.push(coords)}}}
  return out.sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)));
}
function countIn(shape,ax,i){return shape.filter(([y,x])=>ax==='r'?y===i:x===i).length}
function shapeKey(shape){return shape.map(v=>v.join(',')).sort().join('|')}
function init(){
  const d=defs[game][levels[game]];
  if(game==='scan'){
    const choices=scanCandidates(d), secret=choices[d.target % choices.length];
    board={choices,secret,remain:choices.slice(),used:[],guess:new Set(),won:false,feedback:null};
  } else if(game==='cut'){
    board={cuts:new Set(),history:[],won:false,feedback:null};
  } else {
    board={arr:d.start.slice(),history:[],won:false,lastGroup:null,feedback:null};
  }
}
function goHome(){page='home';save();render()}
function openGame(g){game=g;page='game';save();init();render()}
function step(delta){const n=defs[game].length; levels[game]=(levels[game]+delta+n)%n; save(); init(); render()}
function soundIcon(){ $('#soundBtn').textContent=sound?'♫':'♪'; }

function header(d){
  const names={scan:'SCAN GRID',cut:'CUT CIRCUIT',triad:'TRIAD SHIFT'};
  return `<div class="header"><button class="back" id="backBtn">←</button><div class="header-main"><div class="label">${names[game]}</div><div class="title">${d.title}</div><p class="sub">${d.sub}</p></div><div class="toptools"><button class="chipbtn" id="helpBtn">遊び方</button></div></div>`;
}
function stageDots(){return `<div class="dots">${defs[game].map((_,i)=>`<div class="dot ${i===levels[game]?'on':''}"></div>`).join('')}</div>`}
function footer(){
  return `<div class="actions"><button class="action" id="prevBtn">← 前へ</button><button class="action" id="resetBtn">↺ リセット</button><button class="action primary" id="nextStageBtn">次へ →</button></div>${stageDots()}`;
}
function success(){return `<div class="success"><strong>クリア！</strong><div>今のルールで、ちゃんと先読みできた？</div><div class="actions" style="margin-top:10px"><button class="action primary" id="clearNextBtn">次のステージへ</button></div></div>`}

function renderHome(){
  app.innerHTML=`<div class="page"><div class="hero card"><div class="over">THREE PROTOTYPES</div><h1>まずは、<br>何をするゲームかが
すぐ伝わるように。</h1><p>今回は、3つの候補を<strong>UI重視</strong>で磨いた版です。まだ最終評価ではなく、まずは「何をさせられているのか分からない」をなくすことを目標にしています。</p></div>
  ${gameCard('scan','01','SCAN GRID','矢印で行・列を調べて、最後は自分で形を置いて答える。','調べる → 予想する → 指で決める','<svg viewBox="0 0 80 80"><g fill="none" stroke="#cce9ee"><rect x="12" y="12" width="56" height="56" rx="12" fill="#fff"/><path d="M30 12v56M49 12v56M12 30h56M12 49h56"/></g><rect x="31" y="31" width="18" height="18" rx="5" fill="#00a9c0"/><path d="M30 5l-8 8h5v7h6v-7h5zM50 5l-8 8h5v7h6v-7h5z" fill="#94dfe9"/></svg>')}
  ${gameCard('cut','02','CUT CIRCUIT','線をなぞって切り、赤いランプを消しながら青いランプを守る。','タップではなく、指でスパッと切る','<svg viewBox="0 0 80 80"><path d="M12 42h20L44 25h24" stroke="#9cc3cd" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="13" cy="42" r="8" fill="#ffd86f"/><circle cx="44" cy="25" r="8" fill="#4aa3bf"/><circle cx="68" cy="25" r="8" fill="#eb6b71"/><path d="M28 18l11 11M39 18L28 29" stroke="#00a9c0" stroke-width="4" stroke-linecap="round"/></svg>')}
  ${gameCard('triad','03','TRIAD SHIFT','3枚ずつ右へ回す。どの3枚が動いて、どう変わるかを見ながら押す。','押す前に「前 → 後」の変化を見せる','<svg viewBox="0 0 80 80"><rect x="8" y="22" width="18" height="18" rx="6" fill="#eef9fb" stroke="#cde9ee"/><rect x="31" y="22" width="18" height="18" rx="6" fill="#eef9fb" stroke="#cde9ee"/><rect x="54" y="22" width="18" height="18" rx="6" fill="#eef9fb" stroke="#cde9ee"/><text x="17" y="35" font-size="10" font-weight="900" text-anchor="middle" fill="#173746">2</text><text x="40" y="35" font-size="10" font-weight="900" text-anchor="middle" fill="#173746">3</text><text x="63" y="35" font-size="10" font-weight="900" text-anchor="middle" fill="#173746">1</text><path d="M17 53c8 7 38 7 46 0" stroke="#00a9c0" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M59 47l8 6-8 6" fill="none" stroke="#00a9c0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>')}
  <div class="small">これは「ゲームの核」を判断するための試遊研究版です。<br>まだ採用決定ではありません。</div></div>`;
  $$('[data-open]').forEach(b=>b.onclick=()=>{beep(); openGame(b.dataset.open)});
}
function gameCard(id,no,name,desc,tip,svg){return `<button class="menu-item card" data-open="${id}"><div class="menu-illust">${svg}</div><div class="menu-body"><div class="menu-no">GAME ${no}</div><div class="menu-name">${name}</div><div class="menu-desc">${desc}</div><div class="menu-tip">${tip}</div></div><div class="arrow">→</div></button>`}

function scanSample(shape){const n=Math.max(...shape.map(v=>v[0]),...shape.map(v=>v[1]))+1; let cells=''; for(let y=0;y<n;y++) for(let x=0;x<n;x++){ const on=shape.some(([yy,xx])=>yy===y&&xx===x); cells+=`<div class="${on?'on':''}"></div>`; } return `<div class="sample-grid" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${cells}</div>`;}
function scanView(){
  const d=scanDefs[levels.scan], n=d.n; const heat=[]; for(let y=0;y<n;y++)for(let x=0;x<n;x++){let c=0; for(const sh of board.remain) if(sh.some(([yy,xx])=>yy===y&&xx===x)) c++; heat.push(c);} 
  const top=Array.from({length:n},(_,i)=>{const used=board.used.find(u=>u.ax==='c'&&u.i===i); return `<button class="probe ${used?'used':''} ${!used&&i===0&&board.used.length===0?'prompt':''}" ${used?'disabled':''} data-scan="c:${i}">${used?used.count:'↓'}</button>`}).join('');
  const side=Array.from({length:n},(_,i)=>{const used=board.used.find(u=>u.ax==='r'&&u.i===i); return `<button class="probe ${used?'used':''} ${!used&&i===0&&board.used.length===0?'prompt':''}" ${used?'disabled':''} data-scan="r:${i}">${used?used.count:'→'}</button>`}).join('');
  const heatCells=heat.map(v=>{const opacity=v?Math.min(.85,.10+.72*v/board.remain.length):0; return `<div class="cell"><div class="ghost" style="opacity:${opacity}"></div></div>`}).join('');
  const guessCells=Array.from({length:n*n},(_,idx)=>{const y=Math.floor(idx/n),x=idx%n,key=`${y},${x}`;const on=board.guess.has(key); return `<button class="toggle ${on?'on':''}" data-cell="${y},${x}"></button>`}).join('');
  let feedback=`<div class="feedback info">まずは矢印で<strong>行</strong>か<strong>列</strong>を調べよう。数字が出たら、その情報を手がかりに、下の予想グリッドで自分の答えを作る。</div>`;
  if(board.feedback==='wrong') feedback=`<div class="feedback ng">まだちがうみたい。もう少し調べるか、予想を置きなおしてみよう。</div>`;
  if(board.won) feedback=`<div class="feedback ok">ぴったり！ スキャンした情報から、自分で形を当てられた。</div>`;
  return `<div class="stagebar"><strong>STAGE ${levels.scan+1} / ${scanDefs.length}</strong><span>候補 ${board.remain.length} 通り ・ スキャン ${board.used.length} / ${d.cap}</span></div>
    <div class="boardcard card">
      <div class="section"><div class="step">STEP 1</div><h3>矢印で、行や列を調べる</h3><p>押した行・列の中に、形のマスがいくつあるか分かる。</p>
        <div class="shape-sample">${scanSample(normalize(d.shape))}<div class="notice">今回の形はこれ。<br>${d.rot?'向きも変わる。':'向きは固定。'}</div></div>
        <div class="meter"><div class="badge">残り候補 ${board.remain.length}</div><div class="badge">スキャン残り ${d.cap-board.used.length}</div></div>
        <div class="grid-wrap"><div class="scan-area"><div class="scan-top" style="grid-template-columns:repeat(${n},1fr)">${top}</div><div class="scan-side" style="grid-template-rows:repeat(${n},1fr)">${side}</div><div class="heatgrid" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${heatCells}</div></div></div>
      </div>
      <div class="section"><div class="step">STEP 2</div><h3>自分で形を置いて、答える</h3><p>下のマスをタップして、隠れていると思う場所に形を置こう。</p>
        <div class="answergrid" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${guessCells}</div>
        <div class="actions"><button class="action" id="clearGuessBtn">予想を消す</button><button class="action primary" id="checkGuessBtn">これで決定</button></div>
        ${feedback}
      </div>
    </div>${board.won?success():''}${footer()}`;
}
function cutPower(d){const adj={}; d.edges.forEach(([a,b],i)=>{if(board.cuts.has(i)) return; (adj[a]??=[]).push(b); (adj[b]??=[]).push(a)}); const seen=new Set(['S']), q=['S']; while(q.length){ const cur=q.pop(); for(const nxt of (adj[cur]||[])) if(!seen.has(nxt)){seen.add(nxt);q.push(nxt)} } return seen; }
function cutView(){
  const d=cutDefs[levels.cut], live=cutPower(d);
  const svgW=400, svgH=300;
  const edges=d.edges.map(([a,b],i)=>{const p=d.nodes[a], q=d.nodes[b]; const x1=p[0]*svgW, y1=p[1]*svgH, x2=q[0]*svgW, y2=q[1]*svgH; return `<g data-edgeg="${i}"><line class="edge ${board.cuts.has(i)?'cut':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line><line class="edge-hit" data-edge="${i}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line></g>`}).join('');
  const nodes=Object.entries(d.nodes).map(([id,[x,y,t]])=>{const on=live.has(id); return `<g><circle class="node ${t} ${on?'on':'off'}" cx="${x*svgW}" cy="${y*svgH}" r="18"></circle><text class="nlabel" x="${x*svgW}" y="${y*svgH+1}">${t==='s'?'⚡':t==='r'?'赤':t==='b'?'青':'・'}</text><text class="nname" x="${x*svgW}" y="${y*svgH+34}">${id==='S'?'電源':''}</text></g>`}).join('');
  let feedback=`<div class="feedback info">線の上を指でスッとなぞると切れる。<strong>赤は消す</strong>、<strong>青は守る</strong>。</div>`;
  if(board.feedback==='limit') feedback=`<div class="feedback ng">もう切れる本数の上限です。やり直すか、1手もどしてみよう。</div>`;
  if(board.won) feedback=`<div class="feedback ok">条件達成！ 赤だけ消して、青は守れた。</div>`;
  return `<div class="stagebar"><strong>STAGE ${levels.cut+1} / ${cutDefs.length}</strong><span>切った本数 ${board.cuts.size} / ${d.cap}</span></div>
    <div class="boardcard card">
      <div class="section"><div class="step">GOAL</div><h3>赤いランプを消して、青いランプを守る</h3><p>タップではなく、<strong>線を横切るようにスワイプ</strong>して切る。切った線は「1手もどす」や「リセット」で戻せる。</p>
        <div class="meter"><div class="badge red">赤 = 消す</div><div class="badge blue">青 = 守る</div><div class="badge">残り ${d.cap-board.cuts.size} 本</div></div>
        <div class="svgwrap"><svg id="cutSvg" viewBox="0 0 ${svgW} ${svgH}">${edges}${nodes}</svg></div>
        <div class="cutguide"><div class="scissor">✂︎</div><div>線の上を指でスッとなぞると切れる。<br>今のステージでは <strong>${d.cap}本まで</strong> 切ってよい。</div></div>
        ${feedback}
        <div class="actions"><button class="action" id="undoCutBtn" ${board.history.length?'':'disabled'}>1手もどす</button><button class="action" id="resetCutBtn">最初から</button></div>
      </div>
    </div>${board.won?success():''}${footer()}`;
}
function triadView(){
  const d=triadDefs[levels.triad], n=board.arr.length, groups=n-2;
  const tiles=board.arr.map((v,i)=>`<div class="tile ${board.lastGroup!==null && i>=board.lastGroup && i<board.lastGroup+3?'mark':''}">${v}</div>`).join('');
  const target=Array.from({length:n},(_,i)=>`<div class="targetcell">${i+1}</div>`).join('');
  const controls=Array.from({length:groups},(_,i)=>{const a=board.arr[i],b=board.arr[i+1],c=board.arr[i+2]; return `<div class="group"><div class="group-top">左から ${i+1} 〜 ${i+3} 番目の3枚が動く</div><div class="group-preview"><div class="mini"><span class="mtile">${a}</span><span class="mtile">${b}</span><span class="mtile">${c}</span></div><div style="color:var(--cyan2);font-weight:900">→</div><div class="mini"><span class="mtile">${c}</span><span class="mtile">${a}</span><span class="mtile">${b}</span></div></div><button data-triad="${i}">この3枚を右へ1マス回す</button></div>`}).join('');
  let feedback=`<div class="feedback info">ボタンを押す前に、<strong>どの3枚が動くか</strong>と、<strong>押した後どう並ぶか</strong>を下のプレビューで確認しよう。</div>`;
  if(board.won) feedback=`<div class="feedback ok">きれいに並んだ！ どの3枚を選ぶかが分かってくると、見え方が変わる。</div>`;
  return `<div class="stagebar"><strong>STAGE ${levels.triad+1} / ${triadDefs.length}</strong><span>手数 ${board.history.length} / ${d.steps}</span></div>
    <div class="boardcard card">
      <div class="section"><div class="step">NOW</div><h3>今のならび</h3><p>動くのは毎回<strong>3枚だけ</strong>。押すボタンごとに、動く範囲が決まっている。</p>
        <div class="tiles-wrap"><div class="tiles" style="grid-template-columns:repeat(${n},1fr)">${tiles}</div><div class="targetrow" style="grid-template-columns:repeat(${n},1fr)">${target}</div></div>
        ${feedback}
        <div class="actions"><button class="action" id="undoTriadBtn" ${board.history.length?'':'disabled'}>1手もどす</button><button class="action" id="resetTriadBtn">最初から</button></div>
      </div>
      <div class="section"><div class="step">MOVE</div><h3>どの3枚を右へ回す？</h3><p>各ボタンの上にある「前 → 後」を見れば、押した瞬間にどう変わるか分かる。</p><div class="triad-controls">${controls}</div></div>
    </div>${board.won?success():''}${footer()}`;
}

function dialog(){
  const map={
    scan:['SCAN GRID','矢印で行や列を調べて、その情報から最後は自分で形を置いて当てるゲーム。','<strong>1.</strong> 矢印を押す → 数字が出る<br><strong>2.</strong> 候補の濃さを見る<br><strong>3.</strong> 下の予想グリッドで自分の答えを作る'],
    cut:['CUT CIRCUIT','赤いランプだけを消し、青いランプは残すゲーム。線はタップではなく、指でスパッと切る。','<strong>1.</strong> 線の上をスワイプする<br><strong>2.</strong> 電気の流れが変わる<br><strong>3.</strong> 赤は消灯、青は点灯のままを目指す'],
    triad:['TRIAD SHIFT','3枚だけを右に回して、数字を順番どおりに並べるゲーム。','<strong>2 3 1</strong> に対応するボタンを押すと<br><strong>1 2 3</strong> に変わる。<br>どの3枚が動くかを、押す前に必ず見る']
  };
  const d=map[game];
  document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="ov"><div class="dialog"><div class="over">HOW TO PLAY</div><h2>${d[0]}</h2><p>${d[1]}</p><div class="demo">${d[2]}</div><button id="closeOv">わかった！</button></div></div>`);
  $('#closeOv').onclick=()=>$('#ov').remove(); $('#ov').onclick=e=>{if(e.target.id==='ov') $('#ov').remove()};
}

function render(){soundIcon(); if(page==='home'){renderHome(); return;} const d=defs[game][levels[game]]; app.innerHTML=`<div class="page">${header(d)}${game==='scan'?scanView():game==='cut'?cutView():triadView()}</div>`;
  $('#backBtn').onclick=()=>{beep();goHome()}; $('#helpBtn').onclick=()=>dialog(); $('#prevBtn').onclick=()=>{beep(); step(-1)}; $('#resetBtn').onclick=()=>{beep(); init(); render()}; $('#nextStageBtn').onclick=()=>{beep(); step(1)}; $('#clearNextBtn')?.addEventListener('click',()=>{beep(); step(1)});
  if(game==='scan') bindScan(); if(game==='cut') bindCut(); if(game==='triad') bindTriad();
}

function bindScan(){
  const d=scanDefs[levels.scan];
  $$('[data-scan]',app).forEach(b=>b.onclick=()=>{const [ax,iStr]=b.dataset.scan.split(':'), i=+iStr; const count=countIn(board.secret,ax,i); board.remain=board.remain.filter(s=>countIn(s,ax,i)===count); board.used.push({ax,i,count}); board.feedback=null; beep(); render();});
  $$('[data-cell]',app).forEach(b=>b.onclick=()=>{const key=b.dataset.cell; board.guess.has(key)?board.guess.delete(key):board.guess.add(key); beep('tap'); render();});
  $('#clearGuessBtn').onclick=()=>{board.guess.clear(); board.feedback=null; beep(); render();};
  $('#checkGuessBtn').onclick=()=>{const guess=[...board.guess].map(s=>s.split(',').map(Number)); if(shapeKey(guess)===shapeKey(board.secret)){board.won=true; board.feedback='ok'; beep('win');} else {board.feedback='wrong'; beep('tap');} render();};
}
function bindCut(){
  $('#undoCutBtn').onclick=()=>{if(!board.history.length) return; board.cuts=board.history.pop(); board.feedback=null; beep(); render();};
  $('#resetCutBtn').onclick=()=>{board.cuts.clear(); board.history=[]; board.won=false; board.feedback=null; beep(); render();};
  const svg=$('#cutSvg');
  const d=cutDefs[levels.cut];
  const edgeData=d.edges.map(([a,b],i)=>{const p=d.nodes[a],q=d.nodes[b]; return {i,x1:p[0]*400,y1:p[1]*300,x2:q[0]*400,y2:q[1]*300};});
  let active=false, doneInStroke=new Set();
  const pt=(e)=>{const r=svg.getBoundingClientRect(); const touch=e.touches?e.touches[0]:e; return {x:(touch.clientX-r.left)*(400/r.width), y:(touch.clientY-r.top)*(300/r.height)};};
  const dist=(p,e)=>{const A=p.x-e.x1, B=p.y-e.y1, C=e.x2-e.x1, D=e.y2-e.y1; const dot=A*C+B*D, len=C*C+D*D; let t=len?dot/len:0; t=Math.max(0,Math.min(1,t)); const x=e.x1+t*C, y=e.y1+t*D; return Math.hypot(p.x-x,p.y-y);};
  function tryCut(p){for(const ed of edgeData){ if(doneInStroke.has(ed.i) || board.cuts.has(ed.i)) continue; if(board.cuts.size>=d.cap){ board.feedback='limit'; beep(); render(); return true; } if(dist(p,ed)<16){ board.history.push(new Set(board.cuts)); board.cuts.add(ed.i); doneInStroke.add(ed.i); const live=cutPower(d); board.won=Object.entries(d.nodes).every(([id,v])=> v[2]==='r' ? !live.has(id) : v[2]==='b' ? live.has(id) : true); board.feedback=null; beep(board.won?'win':'cut'); render(); return true; } } return false; }
  const start=(e)=>{active=true; doneInStroke=new Set(); tryCut(pt(e)); e.preventDefault();};
  const move=(e)=>{if(!active) return; tryCut(pt(e)); e.preventDefault();};
  const end=()=>{active=false; doneInStroke.clear();};
  svg.addEventListener('mousedown',start); svg.addEventListener('mousemove',move); window.addEventListener('mouseup',end,{once:true});
  svg.addEventListener('touchstart',start,{passive:false}); svg.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',end,{once:true});
}
function bindTriad(){
  const d=triadDefs[levels.triad];
  $('#undoTriadBtn').onclick=()=>{if(!board.history.length) return; board.arr=board.history.pop(); board.lastGroup=null; board.won=false; beep(); render();};
  $('#resetTriadBtn').onclick=()=>{board.arr=d.start.slice(); board.history=[]; board.lastGroup=null; board.won=false; beep(); render();};
  $$('[data-triad]',app).forEach(b=>b.onclick=()=>{const i=+b.dataset.triad; if(board.history.length>=d.steps || board.won) return; board.history.push(board.arr.slice()); const [a,c,e]=board.arr.slice(i,i+3); board.arr.splice(i,3,e,a,c); board.lastGroup=i; board.won=board.arr.every((v,idx)=>v===idx+1); beep(board.won?'win':'rotate'); render();});
}

$('#soundBtn').onclick=()=>{sound=!sound; save(); soundIcon(); if(sound) beep();};
init(); render();
})();
</script>
</body>
</html>
