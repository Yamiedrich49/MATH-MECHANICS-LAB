<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#f8fcfd"><title>MATH MECHANICS LAB | 試遊研究</title><style>
:root{--cyan:#04abc2;--dark:#163645;--muted:#78929d;--hair:#dce9ed;--bg:#f7fbfc;--red:#f06f70;--blue:#0faeca;--shadow:0 10px 30px rgba(33,92,117,.055)}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--dark)}body{overscroll-behavior:none}button{font:inherit;touch-action:manipulation;cursor:pointer}.wrap{max-width:530px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 19px calc(env(safe-area-inset-bottom) + 26px)}.over{font-size:10px;letter-spacing:.20em;font-weight:850;color:var(--cyan);}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:15px}.logo{font-size:26px;letter-spacing:-.065em;font-weight:780;margin:3px 0 3px}.desc{font-size:12px;color:var(--muted);line-height:1.7}.sound{background:white;border:1px solid var(--hair);height:38px;min-width:40px;border-radius:12px;font-size:18px;color:var(--dark)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:23px 0 20px}.tab{border:1px solid var(--hair);border-radius:13px;min-height:52px;background:white;color:#708b95;letter-spacing:.02em;font-size:11px;font-weight:750;line-height:1.35;padding:6px 2px}.tab.active{background:var(--dark);border-color:var(--dark);color:white;box-shadow:0 8px 21px rgba(22,54,69,.17)}.main{background:white;border:1px solid #e4edf0;border-radius:24px;box-shadow:var(--shadow);padding:19px 17px 20px;min-height:490px}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.smalllabel{font-size:10px;font-weight:800;letter-spacing:.11em;color:var(--cyan)}.stage{font-size:12px;color:var(--muted);font-weight:700}.title{font-size:21px;letter-spacing:-.055em;line-height:1.35;font-weight:800;margin:10px 0 5px}.subtitle{font-size:12px;line-height:1.7;color:#6b8995;min-height:38px}.status{display:flex;align-items:center;justify-content:space-between;background:#f2f9fa;margin:16px 0 14px;border-radius:13px;padding:11px 13px;gap:8px}.status strong{font-size:13px;line-height:1.5}.status span{font-size:12px;font-weight:700;color:var(--cyan);text-align:right}.board{width:100%;max-width:430px;margin:10px auto 9px;position:relative}.scanframe{width:100%;max-width:365px;padding:0 0 0 36px;margin:12px auto 15px;position:relative}.scantop{position:absolute;top:0;left:36px;right:0;display:grid}.scanbody{display:flex;padding-top:35px;gap:7px}.scanrows{display:grid;width:29px;flex:none;gap:0}.gridcells{display:grid;flex:1;aspect-ratio:1;border:1px solid #dce9ec;border-radius:13px;overflow:hidden;background:white}.gridcell{border-right:1px solid #e6eff1;border-bottom:1px solid #e6eff1;display:grid;place-items:center;transition:background .23s}.scanbutton{border:0;background:#eaf5f8;color:#3993a9;font-size:12px;font-weight:850;border-radius:8px;min-width:0;display:grid;place-items:center;transition:background .15s}.scanbutton:active{background:#cbe9ed}.scanbutton.used{background:#0eaac0;color:#fff}.scanbutton:disabled{opacity:1}.scanrows{gap:2px}.scantop{gap:2px;height:29px}.scan-arrow{font-size:14px;opacity:.65}.ghost{width:65%;height:65%;border-radius:6px;background:#0eaac0;transition:opacity .2s}.footline{margin:11px 0 0;min-height:20px;text-align:center;color:#74939d;font-size:11px}.svgboard{width:100%;height:auto;max-height:350px;display:block;margin:2px auto 8px;touch-action:none;user-select:none}.edge-hit{stroke:transparent;stroke-width:22;cursor:pointer}.edge-line{stroke:#9bbcc6;stroke-width:5;stroke-linecap:round;pointer-events:none}.edge-line.cut{stroke:#e3e9ed;stroke-width:3;stroke-dasharray:4 8}.node-text{font-size:12px;font-weight:850;dominant-baseline:middle;text-anchor:middle;pointer-events:none}.node-label{font-size:10px;font-weight:700;fill:#90a6ae;text-anchor:middle;pointer-events:none}.gamebottom{display:flex;gap:10px;margin:16px 0 1px}.action{border:1px solid var(--hair);border-radius:12px;min-height:44px;padding:0 16px;color:var(--dark);background:white;font-size:12px;font-weight:800;flex:1}.action.primary{background:var(--cyan);border-color:var(--cyan);color:white}.action:disabled{opacity:.35}.triadboard{max-width:410px;margin:35px auto 30px;position:relative;padding:4px 0}.tiles{display:grid;gap:5px;min-height:74px}.tile{min-width:0;border:1px solid #e1edf1;border-radius:13px;background:#f7fcfd;min-height:66px;display:grid;place-items:center;font-size:26px;color:#254453;font-weight:800;letter-spacing:-.06em;transition:transform .13s,background .13s}.tile:nth-child(odd){background:#ecf8fa}.targets{display:grid;gap:5px;margin:11px 0 22px}.target{font-size:11px;text-align:center;color:#a6bdc4;font-weight:700}.controls{height:43px;position:relative}.turn{border:1px solid #cde8ed;border-radius:50%;background:#e8f7f9;color:var(--cyan);width:41px;height:41px;display:grid;place-items:center;position:absolute;top:0;transform:translateX(-50%);font-size:22px;font-weight:800;box-shadow:0 2px 5px rgba(3,126,148,.04)}.turn:active{transform:translateX(-50%) scale(.94);background:#c5eef2}.done{margin-top:17px;border-radius:15px;background:#e8f9f6;padding:15px 13px;text-align:center;color:#0e877e;font-size:14px;line-height:1.7;font-weight:800;animation:pop .25s ease}.done .big{font-size:27px;display:block;line-height:1.5}.note{line-height:1.75;color:#78929c;font-size:11px;margin:14px 5px 0;text-align:center}.dots{display:flex;justify-content:center;gap:7px;margin-top:16px}.dot{width:6px;height:6px;border-radius:6px;background:#d5e5e9}.dot.on{width:20px;background:var(--cyan)}@keyframes pop{0%{transform:scale(.97);opacity:.4}100%{transform:scale(1);opacity:1}}@media(max-width:360px){.wrap{padding-left:13px;padding-right:13px}.main{padding:17px 12px}.logo{font-size:23px}.tile{min-height:56px;font-size:22px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div class="wrap"><div class="head"><div><div class="over">EXPERIMENT  /  2026.11.07</div><div class="logo">MATH MECHANICS</div><div class="desc">数学ゲームの「面白さの核」を比較する小さな研究室</div></div><button id="snd" class="sound" title="音のオン・オフ" aria-label="音のオン・オフ">♫</button></div><div class="tabs" id="tabs"><button class="tab active" data-game="scan">SCAN GRID<br>観察と情報</button><button class="tab" data-game="cut">CUT CIRCUIT<br>経路と切断</button><button class="tab" data-game="triad">TRIAD SHIFT<br>回転と置換</button></div><main id="main" class="main"></main><div id="dots" class="dots"></div><div class="note">これはゲーム性の検証用です。完成版やUIレベル100を主張するものではありません。<br>通信不要・データ収集なし・進み具合は端末内に保存されます。</div></div><script>
(()=>{'use strict';
const storeKey='math_mechanics_lab_20261107';let saved={};try{saved=JSON.parse(localStorage.getItem(storeKey)||'{}')}catch{};let game=saved.game||'scan';let stageMap=Object.assign({scan:0,cut:0,triad:0},saved.stages||{});let sound=saved.sound!==false;let audio;let state={};const main=document.querySelector('#main');
function save(){try{localStorage.setItem(storeKey,JSON.stringify({game,stages:stageMap,sound}))}catch{}}
function play(type='tap'){if(!sound)return;try{audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let now=audio.currentTime;let notes=type==='win'?[523.25,659.25,783.99,1046.5]:type==='cut'?[280,370]:type==='turn'?[380,480]:[520];notes.forEach((hz,i)=>{let o=audio.createOscillator(),g=audio.createGain(),st=now+i*(type==='win'?.065:.012);o.type='sine';o.frequency.setValueAtTime(hz,st);g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(type==='win'?.075:.045,st+.014);g.gain.exponentialRampToValueAtTime(.0001,st+(type==='win'?.40:.085));o.connect(g).connect(audio.destination);o.start(st);o.stop(st+(type==='win'?.43:.095))})}catch{}}
const scanDef=[
 {n:3,shape:[[0,0],[0,1],[1,0],[1,1]],rot:false,target:3,cap:2,title:'かくれた四角をさがす',sub:'タテかヨコを調べると、その列にあるマスの数が分かる。'},
 {n:4,shape:[[0,0],[0,1],[1,0],[1,1]],rot:false,target:6,cap:4,title:'四角はどこ？',sub:'9か所のどこかに、2×2の四角がかくれている。'},
 {n:4,shape:[[0,0],[1,0],[2,0],[2,1]],rot:true,target:17,cap:4,title:'L字を見つけよう',sub:'かくれたL字は、向きも変わっているかもしれない。'},
 {n:5,shape:[[0,0],[1,0],[2,0],[2,1]],rot:true,target:31,cap:4,title:'48のかのうせい',sub:'48通りから、4回以内のスキャンで見つけられる？'}
];
function shapeN(p){let minY=Math.min(...p.map(z=>z[0])),minX=Math.min(...p.map(z=>z[1]));return p.map(([y,x])=>[y-minY,x-minX]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function scancandidates(s){let shapes=[],current=s.shape;for(let i=0;i<(s.rot?4:1);i++){shapes.push(shapeN(current));current=current.map(([y,x])=>[x,-y])}let seen=new Set(),out=[];for(const shp of shapes){let h=Math.max(...shp.map(v=>v[0]))+1,w=Math.max(...shp.map(v=>v[1]))+1;for(let dy=0;dy<=s.n-h;dy++)for(let dx=0;dx<=s.n-w;dx++){let coords=shp.map(([y,x])=>[y+dy,x+dx]);let key=coords.map(v=>v.join(',')).sort().join('|');if(!seen.has(key)){seen.add(key);out.push(coords)}}}return out.sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))}
function getCount(shape,axis,i){return shape.filter(([y,x])=>axis==='r'?y===i:x===i).length}
const cutDef=[
 {title:'1本で消そう',sub:'赤いランプを消して、青いランプは光らせたままに。線をタップすると切れる。',cap:1,nodes:{S:[.11,.53,'s'],A:[.43,.53,'n'],L:[.78,.23,'b'],R:[.80,.78,'r']},edges:[['S','A'],['A','L'],['A','R']]},
 {title:'もう1本の道',sub:'1本切っても、別の道から電気が流れてしまう。',cap:2,nodes:{S:[.10,.5,'s'],A:[.48,.22,'b'],B:[.48,.78,'b'],R:[.88,.5,'r']},edges:[['S','A'],['S','B'],['A','R'],['B','R']]},
 {title:'3個を2本で消す',sub:'赤ランプは3個。だけど切ってよいのは2本だけ。',cap:2,nodes:{S:[.08,.5,'s'],A:[.31,.26,'b'],B:[.31,.74,'b'],H:[.57,.5,'n'],R1:[.83,.16,'r'],R2:[.92,.5,'r'],R3:[.83,.84,'r']},edges:[['S','A'],['S','B'],['A','H'],['B','H'],['H','R1'],['H','R2'],['H','R3']]},
 {title:'今度は切れない？',sub:'青ランプが1個増えた。同じ手を使うと、青まで消えてしまう。',cap:3,nodes:{S:[.07,.5,'s'],A:[.26,.24,'b'],B:[.26,.76,'b'],H:[.48,.5,'n'],T:[.69,.5,'b'],R1:[.90,.16,'r'],R2:[.92,.5,'r'],R3:[.90,.84,'r']},edges:[['S','A'],['S','B'],['A','H'],['B','H'],['H','T'],['T','R1'],['T','R2'],['T','R3']]}
];
const triadDef=[
 {start:[2,3,1,4],steps:1,title:'3枚をくるり',sub:'↻ を押すと、となり合う3枚が右に1つずつずれる。'},
 {start:[3,1,2,4],steps:2,title:'もう一度、くるり',sub:'下にある薄い数字の順番に、少ない手数で並べよう。'},
 {start:[4,3,2,1],steps:4,title:'逆さのならび',sub:'どの3枚を回せば、次の一手につながる？'},
 {start:[5,4,3,2,1],steps:6,title:'5枚の大逆転',sub:'やみくもに回すより、変化を考えてみよう。'},
 {start:[6,2,4,3,5,1],steps:7,title:'6枚のからくり',sub:'最初の一手を見通せるか、挑戦しよう。'}
];
let defs={scan:scanDef,cut:cutDef,triad:triadDef};
function init(){let def=defs[game][stageMap[game]];if(game==='scan'){let choices=scancandidates(def);state={choices,secret:choices[def.target%choices.length],rem:choices.slice(),used:[],win:false,fail:false}}
else if(game==='cut')state={cut:new Set(),win:false};else state={arr:def.start.slice(),history:[],win:false}}
function setup(gameNew){game=gameNew;save();init();draw()}
function advance(dir){let n=defs[game].length;stageMap[game]=(stageMap[game]+dir+n)%n;save();init();draw()}
function baseHtml(d){return `<div class="topline"><span class="smalllabel">${{scan:'HIDDEN STRUCTURE',cut:'NETWORK LOGIC',triad:'PERMUTATION'}[game]}</span><span class="stage">STAGE ${stageMap[game]+1} / ${defs[game].length}</span></div><div class="title">${d.title}</div><div class="subtitle">${d.sub}</div>`}
function finalHtml(){return `<div class="done"><span class="big">✓</span>クリア！<br>予想したしくみは当たった？<br><button class="action primary" id="next" style="margin-top:12px;max-width:240px">次のステージへ　→</button></div>`}
function bottomHtml(){return `<div class="gamebottom"><button class="action" id="previous">← 前へ</button><button class="action" id="reset">↺ リセット</button><button class="action primary" id="skip">次へ →</button></div>`}
function draw(){document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('active',e.dataset.game===game));document.querySelector('#snd').textContent=sound?'♫':'♪̸';let d=defs[game][stageMap[game]];main.innerHTML=baseHtml(d)+(game==='scan'?drawScan(d):game==='cut'?drawCut(d):drawTriad(d))+(state.win?finalHtml():bottomHtml());document.querySelector('#dots').innerHTML=defs[game].map((_,i)=>`<div class="dot ${i===stageMap[game]?'on':''}"></div>`).join('');wire()}
function drawScan(d){let n=d.n,counts=[...Array(n*n)].map(()=>0);for(let shape of state.rem)for(let [y,x] of shape)counts[y*n+x]++;let iswin=state.rem.length===1;
let cols=Array.from({length:n},(_,i)=>{let q=state.used.find(u=>u.axis==='c'&&u.idx===i);return `<button class="scanbutton ${q?'used':''}" ${q||state.win||state.fail?'disabled':''} data-axis="c" data-i="${i}">${q?q.value:'↓'}</button>`}).join('');let rows=Array.from({length:n},(_,i)=>{let q=state.used.find(u=>u.axis==='r'&&u.idx===i);return `<button class="scanbutton ${q?'used':''}" ${q||state.win||state.fail?'disabled':''} data-axis="r" data-i="${i}">${q?q.value:'→'}</button>`}).join('');let cells=counts.map((v,j)=>{let opacity= iswin?(v?1:0):Math.min(.75,.09+.70*v/state.rem.length);return `<div class="gridcell"><div class="ghost" style="opacity:${v?opacity:0}"></div></div>`}).join('');
let msg=state.fail?'スキャンが足りない。別の順番を試そう。':state.win?'かくれた形を発見！':'色の濃さは、そのマスに形がある可能性の目安。';return `<div class="status"><strong>残り候補　${state.rem.length} 通り</strong><span>スキャン残り ${Math.max(0,d.cap-state.used.length)} 回</span></div><div class="scanframe"><div class="scantop" style="grid-template-columns:repeat(${n},1fr)">${cols}</div><div class="scanbody"><div class="scanrows" style="grid-template-rows:repeat(${n},1fr)">${rows}</div><div class="gridcells" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${cells}</div></div></div><div class="footline">${msg}</div>`}
function power(d){let adj={};d.edges.forEach(([a,b],k)=>{if(state.cut.has(k))return;(adj[a]??=[]).push(b);(adj[b]??=[]).push(a)});let seen=new Set(['S']),queue=['S'];while(queue.length){for(let q of adj[queue.pop()]||[])if(!seen.has(q)){seen.add(q);queue.push(q)}}return seen}
function drawCut(d){let live=power(d),nodes=d.nodes;let edges=d.edges.map(([a,b],i)=>{let p=nodes[a],q=nodes[b],x1=p[0]*400,y1=p[1]*320,x2=q[0]*400,y2=q[1]*320,c=state.cut.has(i);return `<g data-edge="${i}"><line class="edge-line ${c?'cut':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line><line class="edge-hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"></line></g>`}).join('');
let ns=Object.entries(nodes).map(([id,[x,y,type]])=>{let on=live.has(id),xx=x*400,yy=y*320,c=type==='r'?'#ee777b':type==='b'?'#04abc2':type==='s'?'#203f4b':'#9bb6bf',fill=on?c:'#e0e9ec',label=type==='r'?'消':type==='b'?'守':type==='s'?'電':'';return `<g><circle cx="${xx}" cy="${yy}" r="${type==='n'?11:17}" fill="${fill}" opacity="${on?1:.73}"></circle><circle cx="${xx}" cy="${yy}" r="${type==='n'?5:7}" fill="#fff" opacity="${on?.92:.45}"></circle>${label?`<text class="node-label" x="${xx}" y="${yy+29}">${label}</text>`:''}</g>`}).join('');let won=Object.entries(nodes).every(([id,v])=>v[2]==='r'?!live.has(id):v[2]==='b'?live.has(id):true);if(won&&!state.win){state.win=true;queueMicrotask(()=>{play('win');draw()})};let msg=state.win?'赤は全部消え、青は全部点いている！':'線をタップして切断。もう一度タップするとつながる。';return `<div class="status"><strong><span style="color:#e77b80">●</span> 赤を消す　<span style="color:#04abc2">●</span> 青を守る</strong><span>切断 ${state.cut.size} / ${d.cap} 本</span></div><svg class="svgboard" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" aria-label="電源と赤青のランプのネットワーク">${edges}${ns}</svg><div class="footline">${msg}</div>`}
function drawTriad(d){let n=state.arr.length,k=state.history.length;let tiles=state.arr.map(v=>`<div class="tile">${v}</div>`).join(''),tar=state.arr.map((v,i)=>`<div class="target">${i+1}</div>`).join(''),turns=Array.from({length:n-2},(_,i)=>`<button class="turn" aria-label="${i+1}番目からの3枚を回転" data-triad="${i}" style="left:${(i+1.5)*100/n}%" ${k>=d.steps||state.win?'disabled':''}>↻</button>`).join('');return `<div class="status"><strong>小さい数字の順番に並べる</strong><span>残り ${Math.max(0,d.steps-k)} 手</span></div><div class="triadboard"><div class="tiles" style="grid-template-columns:repeat(${n},1fr)">${tiles}</div><div class="targets" style="grid-template-columns:repeat(${n},1fr)">${tar}</div><div class="controls">${turns}</div></div><div class="footline">${k===d.steps&&!state.win?'手数を使い切った。戻して考え直そう。':'↻ の真上に並んだ3枚を右に1マス回そう。'}</div>${k>0&&!state.win?'<div class="gamebottom"><button class="action" id="undo">↶ 1手もどす</button></div>':''}`}
function wire(){main.querySelector('#previous')?.addEventListener('click',()=>advance(-1));main.querySelector('#skip')?.addEventListener('click',()=>advance(1));main.querySelector('#next')?.addEventListener('click',()=>advance(1));main.querySelector('#reset')?.addEventListener('click',()=>{init();play('tap');draw()});main.querySelector('#undo')?.addEventListener('click',()=>{state.arr=state.history.pop();play('turn');draw()});main.querySelectorAll('[data-axis]').forEach(b=>b.addEventListener('click',()=>{let d=scanDef[stageMap.scan],axis=b.dataset.axis,i=+b.dataset.i;if(state.used.length>=d.cap||state.win)return;let value=getCount(state.secret,axis,i);state.used.push({axis,idx:i,value});state.rem=state.rem.filter(s=>getCount(s,axis,i)===value);state.win=state.rem.length===1;state.fail=!state.win&&state.used.length>=d.cap;play(state.win?'win':'tap');draw()}));main.querySelectorAll('[data-edge]').forEach(b=>b.addEventListener('click',()=>{let d=cutDef[stageMap.cut],i=+b.dataset.edge;if(state.win)return;if(state.cut.has(i))state.cut.delete(i);else{if(state.cut.size>=d.cap)return;state.cut.add(i)}play('cut');draw()}));main.querySelectorAll('[data-triad]').forEach(b=>b.addEventListener('click',()=>{let d=triadDef[stageMap.triad],i=+b.dataset.triad;if(state.history.length>=d.steps||state.win)return;state.history.push(state.arr.slice());let [a,c,e]=state.arr.slice(i,i+3);state.arr.splice(i,3,e,a,c);state.win=state.arr.every((v,j)=>v===j+1);play(state.win?'win':'turn');draw()}))}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.game===game)return;play('tap');setup(b.dataset.game)}));document.querySelector('#snd').addEventListener('click',()=>{sound=!sound;save();if(sound)play('tap');draw()});init();draw();
})();
</script></body></html>
