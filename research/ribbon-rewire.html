<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f8f5"><title>RIBBON REWIRE · Math Mechanics Lab</title>
<style>
:root{--bg:#f7f8f5;--paper:#fff;--ink:#203e44;--muted:#82949b;--line:#e1e9e5;--teal:#088b8a;--teal2:#42bdb5;--amber:#d3a352;--pale:#e9f6f2;--shadow:0 12px 38px rgba(31,73,67,.055)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif} body{overscroll-behavior-y:none} button{font:inherit;cursor:pointer;touch-action:manipulation;color:inherit}button:focus-visible{outline:3px solid #8bdacf;outline-offset:3px}.shell{max-width:535px;margin:auto;min-height:100svh;padding:calc(14px + env(safe-area-inset-top)) 17px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;min-height:42px}.nav{height:40px;width:40px;border:1px solid var(--line);background:white;border-radius:13px;display:grid;place-items:center;text-decoration:none;color:var(--ink)}.brand{flex:1;min-width:0}.brand small{display:block;font-weight:850;font-size:9px;letter-spacing:.21em;color:var(--teal)}.brand strong{font-size:18px;letter-spacing:-.05em}.sound{width:40px;height:40px;border:1px solid var(--line);border-radius:13px;background:white;font-size:18px}
.topcopy{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:18px 2px 8px}.topcopy h1{font-size:29px;letter-spacing:-.06em;line-height:1.1;margin:5px 0 4px;font-weight:850}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:850;color:var(--teal)}.desc{font-size:12px;color:var(--muted);line-height:1.6;margin:7px 0 0}.levelnum{font-weight:850;color:var(--teal);font-size:12px;white-space:nowrap;text-align:right;margin-bottom:5px}.little{font-size:11px;color:var(--muted)}
.goalbar{margin:14px 0 10px;border:1px solid var(--line);border-radius:15px;padding:10px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:white}.goalbar .left{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:780}.gold-dot{width:12px;height:12px;border:3px solid var(--amber);border-radius:50%;display:inline-block}.counter{color:var(--teal);font-size:12px;font-weight:850;white-space:nowrap}
.boardframe{border:1px solid #e1e9e4;border-radius:27px;padding:12px;background:linear-gradient(165deg,#fff 0%,#fcfdfa 100%);box-shadow:var(--shadow);position:relative;overflow:hidden}.boardframe:before{content:"";position:absolute;inset:14px;border:1px solid rgba(111,149,135,.06);border-radius:18px;pointer-events:none}.board{width:100%;aspect-ratio:1;display:block;touch-action:none;user-select:none}.board .gridline{stroke:#e9eeea;stroke-width:1.5}.board .node{fill:#e3ebe6}.board .rope-shadow{stroke:#d1e5dd;stroke-width:21;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.7}.board .rope{stroke:#0a908f;stroke-width:15;stroke-linecap:round;stroke-linejoin:round;fill:none}.board .rope-gloss{stroke:#5bc9bd;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none;opacity:.8} .board .old-rope{stroke:#d09b64;stroke-width:12;stroke-linecap:round;fill:none;animation:oldfade .46s ease-out forwards}.board .new-edge{stroke:#e3b15b;stroke-width:12;stroke-linecap:round;fill:none;stroke-dasharray:300;stroke-dashoffset:300;animation:connect .48s cubic-bezier(.2,.75,.2,1) forwards}.board .marker{stroke-width:3;fill:none}.board .endpoint{fill:#fff;stroke:var(--teal);stroke-width:6}.board .endpoint.origin{fill:var(--teal)}.board .glow{fill:rgba(22,165,152,.10)}.board .target{fill:#fff;stroke:var(--amber);stroke-width:4;stroke-dasharray:3.4 4}.board .possible{fill:#e2f7f0;stroke:#8dd0c0;stroke-width:3}.board .guide{stroke:#e3b972;stroke-width:5;stroke-dasharray:7 8;stroke-linecap:round}.board .dragline{stroke:#e1b567;stroke-width:7;stroke-linecap:round;opacity:.82}.board text{font-weight:800;fill:#97a89f;font-size:13px;pointer-events:none}.board .target-label{fill:#ae8339;font-size:12px}.board .hint-mark{fill:#d3a352;opacity:.95}
.help{display:flex;justify-content:center;align-items:center;gap:6px;font-size:12px;color:#758e89;line-height:1.6;margin:12px 4px 0;text-align:center;min-height:36px}.help .em{font-weight:850;color:var(--teal)}
.footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}.footer button{height:47px;border-radius:14px;background:white;border:1px solid var(--line);font-size:12px;font-weight:830}.footer .next{background:var(--teal);color:white;border-color:var(--teal)}.utility{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}.textbtn{color:#7b9692;font-size:11px;font-weight:750;background:none;border:0;padding:7px 12px}.status{font-size:12px;color:#73918a;text-align:center;padding:7px 4px;min-height:26px}.won{color:var(--teal);font-weight:850;animation:pop .30s ease-out}.levels{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:13px}.levels button{width:8px;height:8px;padding:0;border:0;background:#d9e7df;border-radius:10px;transition:all .2s}.levels button.active{width:27px;background:var(--teal)}.tips{font-size:10px;color:#91a7a0;text-align:center;margin-top:12px;line-height:1.55}.sweep{stroke:#f1cf7c;stroke-width:6;stroke-linecap:round;fill:none;stroke-dasharray:20 1600;animation:sweep 0.54s ease-out forwards}
@keyframes oldfade{to{opacity:0}}@keyframes connect{to{stroke-dashoffset:0}}@keyframes sweep{from{stroke-dashoffset:0;opacity:.9}to{stroke-dashoffset:-550;opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:.35}to{transform:scale(1);opacity:1}}
@media(max-width:370px){.shell{padding-left:12px;padding-right:12px}.topcopy h1{font-size:26px}.boardframe{padding:8px}.goalbar{padding:9px 10px}.footer{gap:6px}}
@media(max-height:770px){.topcopy{margin-top:10px}.boardframe{padding:7px}.desc{margin-top:3px}.help{min-height:26px;margin-top:7px}.footer{margin-top:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* v5: the rules appear on the board, not in a manual */
.board .coach-line{fill:none;stroke:#d0a15a;stroke-width:4;stroke-dasharray:5 10;stroke-linecap:round;animation:coachFlow 1.75s linear infinite;pointer-events:none}
.board .coach-target{fill:#fcf5e6;stroke:#d4aa6b;stroke-width:3;animation:coachRing 1.75s ease-in-out infinite;pointer-events:none}
.board .coach-hand{fill:#fff9ed;stroke:#cca66a;stroke-width:3;animation:coachHand 1.75s ease-in-out infinite;pointer-events:none}
.board .eligible{fill:#e6f8f4;stroke:#85cabd;stroke-width:4;animation:coachRing 2s ease-in-out infinite;pointer-events:none}
.board .eligible-core{fill:#278d87;pointer-events:none}
.board .preview-link{stroke:#d9a956;stroke-width:10;stroke-linecap:round;stroke-dasharray:9 7;fill:none;pointer-events:none}
.board .preview-break{stroke:#cbaaa1;stroke-width:6;stroke-linecap:round;stroke-dasharray:5 9;fill:none;pointer-events:none}
.board .new-tip-pulse{fill:none;stroke:#d9a956;stroke-width:5;animation:tipPop .7s ease-out forwards;pointer-events:none}
.board .marker-label{fill:#af8c51;letter-spacing:.05em;font-size:12px;font-weight:800;pointer-events:none}
.board .handle{touch-action:none}
.tactile-banner{margin-top:10px;min-height:38px;border-radius:13px;background:#eaf6f2;border:1px solid #d8eee7;color:#437d74;display:flex;gap:8px;align-items:center;justify-content:center;font-size:12px;font-weight:750;line-height:1.35;text-align:center;padding:8px 10px}
.tactile-banner b{color:#087f7c;font-weight:850}
.tactile-banner .sign{font-size:17px;line-height:1}
@keyframes coachFlow{to{stroke-dashoffset:-60}}
@keyframes coachRing{0%,100%{opacity:.45;stroke-width:2;transform:none}50%{opacity:1;stroke-width:4}}
@keyframes coachHand{0%,100%{opacity:.8;transform:translate(0,0)}50%{opacity:1;transform:translate(0,3px)}}
@keyframes tipPop{from{opacity:.96;stroke-width:4;transform:scale(.65);transform-origin:center}to{opacity:0;stroke-width:1;transform:scale(1.75);transform-origin:center}}
@media(max-height:740px){.tactile-banner{margin-top:6px;padding:5px 8px;min-height:29px}}
</style></head><body><div class="shell">
 <header class="top"><a href="../" class="nav" aria-label="研究所に戻る">‹</a><div class="brand"><small>MATH MECHANICS LAB / 04</small><strong>RIBBON REWIRE</strong></div><button id="sound" class="sound" aria-label="音を切り替え">♫</button></header>
 <div class="topcopy"><div><div class="eyebrow">A SINGLE THREAD</div><h1 id="puzzleTitle">端を、つなぎ替える。</h1><p class="desc" id="puzzleDesc">紐の端をつまんで、隣の点へつなぐ。</p></div><div><div id="level" class="levelnum">01 / 06</div><div id="best" class="little">最短 1手</div></div></div>
 <div class="goalbar"><div class="left"><i class="gold-dot"></i><span>紐の両端を、金色の2点へ</span></div><div id="moves" class="counter">0 手</div></div>
 <section class="boardframe"><svg id="board" class="board" viewBox="0 0 420 420" aria-label="紐の盤面"></svg></section>
 <div class="tactile-banner" id="helper"><span class="sign">◉</span><span>色のついた<strong>端</strong>を、光る<strong>接続点</strong>へ引っぱる</span></div>
 <div class="status" id="status" role="status"></div>
 <div class="footer"><button id="prev">← 前へ</button><button id="reset">やり直す</button><button class="next" id="next">次へ →</button></div>
 <div class="utility"><button class="textbtn" id="undo">↶ 1手もどす</button><button class="textbtn" id="hint">小さなヒント</button></div>
 <div class="levels" id="levels"></div>
 <p class="tips">研究試作版 · 指先の動きと先読みの面白さを検証中</p>
</div>
<script>
(()=>{'use strict';
const defs=[
 {n:3,path:[0,1,2,5,4,3,6,7,8],goal:[4,8],best:1,title:'ひと結び',desc:'金の2点を紐の両端に。端を隣の点へ。'},
 {n:3,path:[0,1,2,5,4,3,6,7,8],goal:[2,8],best:2,title:'もう一つ先へ',desc:'つなぐと、別の場所が端になる。'},
 {n:4,path:[0,1,2,3,7,6,5,4,8,9,10,11,15,14,13,12],goal:[7,12],best:3,title:'長い紐の一手',desc:'全体がつながっていることを忘れずに。'},
 {n:4,path:[0,1,2,3,7,6,5,4,8,12,13,14,15,11,10,9],goal:[9,15],best:4,title:'ひっくり返る道',desc:'変わるのは一か所。でも、次の端は遠くに現れる。'},
 {n:4,path:[5,6,7,3,2,1,0,4,8,9,10,11,15,14,13,12],goal:[4,13],best:5,title:'二つの端の作戦',desc:'どちらの端を動かすかが分かれ道。'},
 {n:4,path:[2,3,7,6,5,9,10,11,15,14,13,12,8,4,0,1],goal:[8,9],best:6,title:'リボン・マスター',desc:'手探りでは遠回り。紐のつながりを読み切る。'}
];
const $=id=>document.getElementById(id);let level=0,sound=true,history=[],path=[],won=false,drag=null,armed=null,lock=false,oldPath=null,highlight=null,hint=null,animTimer=null,ctx=null,lastTip=null; const saveKey='mm_ribbon_rewire_v1';
try{const p=JSON.parse(localStorage.getItem(saveKey)||'{}'); level=Math.max(0,Math.min(defs.length-1,parseInt(p.level)||0));sound=p.sound!==false}catch(e){}
function save(){try{localStorage.setItem(saveKey,JSON.stringify({level,sound}))}catch(e){}}
function tone(kind='tap'){if(!sound)return;try{ctx ||= new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();const t=ctx.currentTime,ns=kind==='win'?[523,659,784,1047]:kind==='join'?[349,466]:[550];ns.forEach((hz,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),st=t+i*(kind==='win'?.075:.035);o.type='sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(kind==='win'?.055:.026,st+.012);g.gain.exponentialRampToValueAtTime(.0001,st+(kind==='win'?.43:.12));o.connect(g).connect(ctx.destination);o.start(st);o.stop(st+(kind==='win'?.45:.14))})}catch(e){}}
const coords=(id)=>{let n=defs[level].n, m=n===3?88:63,step=(420-2*m)/(n-1);return {x:m+(id%n)*step,y:m+Math.floor(id/n)*step}};
const dpath=p=>p.map((v,i)=>{const {x,y}=coords(v);return `${i?'L':'M'}${x} ${y}`}).join(' ');
function neighbors(side){const n=defs[level].n,src=side===0?path:path.slice().reverse(),start=src[0];return src.slice(2,-1).map((id,index)=>({id,j:index+2})).filter(({id})=>Math.abs(Math.floor(id/n)-Math.floor(start/n))+Math.abs(id%n-start%n)===1)}
function changes(side,dest){const p=side===0?path:path.slice().reverse();const j=p.indexOf(dest);if(j<2||j>=p.length-1)return null;const a=p.slice(0,j).reverse().concat(p.slice(j));return side===0?a:a.reverse()}
function isWin(){const g=defs[level].goal.slice().sort((a,b)=>a-b).join(',');return [path[0],path[path.length-1]].sort((a,b)=>a-b).join(',')===g}
function esc(s){return s.replaceAll('&','&amp;').replaceAll('<','&lt;')}
function draw(){
 const def=defs[level],n=def.n,p=path,svg=$('board');let content='';
 // The board is the whole interface: grid, goals, valid touch points, and rope.
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const id=y*n+x,{x:px,y:py}=coords(id);if(x<n-1)content+=`<path class="gridline" d="M${px} ${py} H${coords(id+1).x}"/>`;if(y<n-1)content+=`<path class="gridline" d="M${px} ${py} V${coords(id+n).y}"/>`;}
 def.goal.forEach(id=>{const q=coords(id);content+=`<circle class="target" cx="${q.x}" cy="${q.y}" r="24"/><circle cx="${q.x}" cy="${q.y}" r="3" fill="#d5a751"/>`});
 content+=`<path class="rope-shadow" d="${dpath(p)}"/><path class="rope" d="${dpath(p)}"/><path class="rope-gloss" d="${dpath(p)}"/>`;
 if(oldPath){
   const key=(a,b)=>[Math.min(a,b),Math.max(a,b)].join(':');
   const prev=new Set(oldPath.slice(1).map((v,i)=>key(oldPath[i],v)));
   const next=new Set(p.slice(1).map((v,i)=>key(p[i],v)));
   for(const e of prev)if(!next.has(e)){const [a,b]=e.split(':').map(Number),A=coords(a),B=coords(b);content+=`<path class="old-rope" d="M${A.x} ${A.y}L${B.x} ${B.y}"/>`}
   for(const e of next)if(!prev.has(e)){const [a,b]=e.split(':').map(Number),A=coords(a),B=coords(b);content+=`<path class="new-edge" d="M${A.x} ${A.y}L${B.x} ${B.y}"/>`}
   content+=`<path class="sweep" d="${dpath(p)}"/>`;
 }
 const ends=[p[0],p[p.length-1]],active=drag!==null?drag.side:armed;
 if(active!==null){
   const poss=neighbors(active);
   poss.forEach(({id})=>{const q=coords(id);content+=`<circle class="eligible" cx="${q.x}" cy="${q.y}" r="22"/><circle class="eligible-core" cx="${q.x}" cy="${q.y}" r="5"/>`});
   if(drag!==null){
     const e=coords(ends[active]);content+=`<line class="dragline" x1="${e.x}" y1="${e.y}" x2="${drag.x}" y2="${drag.y}"/>`;
     const nearCandidate=poss.map(x=>({...x,delta:Math.hypot(coords(x.id).x-drag.x,coords(x.id).y-drag.y)})).sort((a,b)=>a.delta-b.delta)[0];
     // Only after the user is actively dragging do we show the piece of ribbon that will disconnect.
     if(nearCandidate && nearCandidate.delta<57){
       const src=active===0?p:p.slice().reverse(),j=src.indexOf(nearCandidate.id),cut=coords(src[j-1]),dest=coords(src[j]),from=coords(ends[active]);
       content+=`<path class="preview-break" d="M${cut.x} ${cut.y}L${dest.x} ${dest.y}"/>`;
       content+=`<path class="preview-link" d="M${from.x} ${from.y}L${dest.x} ${dest.y}"/>`;
     }
   }
 }else if(level===0 && history.length===0 && !won){
   // On the first puzzle, the gesture is taught once, without a separate screen or text overlay.
   const start=coords(p[0]),target=coords(neighbors(0)[0].id);
   content+=`<path class="coach-line" d="M${start.x} ${start.y}L${target.x} ${target.y}"/>`;
   content+=`<circle class="coach-target" cx="${target.x}" cy="${target.y}" r="22"/>`;
   content+=`<circle class="coach-hand" cx="${start.x-28}" cy="${start.y+2}" r="8"/>`;
   content+=`<text class="marker-label" x="${target.x+29}" y="${target.y+5}">ここへ</text>`;
 }else if(!won){
   // Quietly reveal what can be grabbed; not the result of the move.
   ends.forEach((id,side)=>{if(neighbors(side).length){const q=coords(id);content+=`<circle class="glow" cx="${q.x}" cy="${q.y}" r="29"/>`}});
 }
 if(hint!==null){const q=coords(ends[hint]);content+=`<circle cx="${q.x}" cy="${q.y}" r="29" fill="none" stroke="#d5a751" stroke-width="2" stroke-dasharray="4 5"/>`}
 ends.forEach((id,side)=>{const q=coords(id);content+=`<circle class="endpoint ${side===0?'origin':''}" cx="${q.x}" cy="${q.y}" r="15" style="${side===1?'stroke:#2d565c':''}"/>`;if(lastTip===id)content+=`<circle class="new-tip-pulse" cx="${q.x}" cy="${q.y}" r="22"/>`;content+=`<circle cx="${q.x}" cy="${q.y}" r="33" fill="transparent" class="handle" data-side="${side}"/>`});
 if(won){content+=`<rect x="93" y="181" width="234" height="58" rx="18" fill="#ffffff" stroke="#c5e3d6" stroke-width="1.5"/><text x="210" y="217" text-anchor="middle" style="font-size:19px;font-weight:850;fill:#088b8a">つながった ✓</text>`}
 svg.innerHTML=content;
 $('level').textContent=String(level+1).padStart(2,'0')+' / '+String(defs.length).padStart(2,'0');$('best').textContent=`最短 ${def.best}手`;$('moves').textContent=history.length+' 手';$('puzzleTitle').textContent=def.title;$('puzzleDesc').textContent=def.desc;
 $('status').className=won?'status won':'status';$('status').textContent=won?`${history.length===def.best?'最短手数でクリア。':'クリア！ さらに短い道もある。'}`:'';
 const helper=$('helper');
 if(won)helper.innerHTML='<span class="sign">✓</span><span>金色の2つの輪に、両端が到着</span>';
 else if(drag!==null)helper.innerHTML='<span class="sign">↗</span><span>光る点で指を離すと、<b>紐が組み替わる</b></span>';
 else if(armed!==null)helper.innerHTML='<span class="sign">◎</span><span>光る点を<strong>タップ</strong>してもつなぎ替えられる</span>';
 else if(lastTip!==null)helper.innerHTML='<span class="sign">↶</span><span>つなぎ目が変わり、<b>別の場所が端になった</b></span>';
 else helper.innerHTML=level===0?'<span class="sign">☝</span><span><b>緑の端</b>をつかみ、点線の先へ滑らせる</span>':'<span class="sign">◉</span><span>紐の<b>端</b>をつかむと、つなげる点が光る</span>';
 $('undo').disabled=history.length===0||lock;$('hint').disabled=lock||won;
 $('levels').innerHTML=defs.map((_,i)=>`<button data-lvl="${i}" class="${i===level?'active':''}" aria-label="問題${i+1}"></button>`).join('');$('levels').querySelectorAll('button').forEach(b=>b.onclick=()=>setLevel(+b.dataset.lvl));
}

function setLevel(n){if(lock)return;level=(n+defs.length)%defs.length;history=[];path=defs[level].path.slice();won=false;drag=null;armed=null;oldPath=null;hint=null;lastTip=null;save();draw();}
function toPoint(e){let r=$('board').getBoundingClientRect(),size=Math.min(r.width,r.height);return{x:(e.clientX-r.left)*420/size,y:(e.clientY-r.top)*420/size}}
function near(a,b,d){return Math.hypot(a.x-b.x,a.y-b.y)<d}
function commit(side,dest){const next=changes(side,dest);if(!next)return false;history.push(path.slice());oldPath=path;path=next;lastTip=side===0?path[0]:path[path.length-1];armed=null;drag=null;lock=true;won=isWin();draw();tone(won?'win':'join');clearTimeout(animTimer);animTimer=setTimeout(()=>{oldPath=null;lock=false;if(!won){lastTip=null}draw()},650);return true}
function start(e){if(lock||won)return;const pt=toPoint(e);
 if(armed!==null){const selected=neighbors(armed).find(({id})=>near(coords(id),pt,38));if(selected){commit(armed,selected.id);e.preventDefault();return}}
 const ends=[path[0],path[path.length-1]],side=ends.findIndex(v=>near(coords(v),pt,35));if(side<0){armed=null;draw();return}
 drag={side,x:pt.x,y:pt.y,ox:pt.x,oy:pt.y};armed=null;hint=null;$('board').setPointerCapture?.(e.pointerId);tone('tap');draw();e.preventDefault();}
function move(e){if(drag===null)return;const pt=toPoint(e);drag.x=pt.x;drag.y=pt.y;draw();e.preventDefault()}
function end(e){if(drag===null)return;const pt=toPoint(e),side=drag.side,initial=drag;drag=null;
 const choices=neighbors(side).map(({id})=>({id,dist:Math.hypot(coords(id).x-pt.x,coords(id).y-pt.y)})).sort((a,b)=>a.dist-b.dist);
 const threshold=defs[level].n===3?61:50;
 if(choices.length && choices[0].dist<=threshold && Math.hypot(pt.x-initial.ox,pt.y-initial.oy)>20){commit(side,choices[0].id);e.preventDefault();return;}
 if(Math.hypot(pt.x-initial.ox,pt.y-initial.oy)<24){armed=side;draw();e.preventDefault();return;}
 // Forgiving snap if the finger clearly moves toward a unique destination.
 if(choices.length===1 && choices[0].dist<82 && Math.hypot(pt.x-initial.ox,pt.y-initial.oy)>34){commit(side,choices[0].id);e.preventDefault();return}
 armed=side;draw();}

function undo(){if(lock||!history.length)return;path=history.pop();won=false;armed=null;lastTip=null;hint=null;oldPath=null;tone('tap');draw()}
function solveHint(){
 // 現在の経路からゴールまでを探索し、最初に動かす端だけを示す。
 const n=defs[level].n,target=defs[level].goal.slice().sort((a,b)=>a-b).join(',');
 const q=[{p:path,first:null}],seen=new Set([path.join(',')]);
 while(q.length){
   const {p,first}=q.shift();
   if([p[0],p[p.length-1]].sort((a,b)=>a-b).join(',')===target){hint=first===null?null:first;draw();return;}
   for(let side=0;side<2;side++){
     const src=side?p.slice().reverse():p,start=src[0];
     for(let j=2;j<src.length-1;j++){
       const z=src[j];
       if(Math.abs(Math.floor(start/n)-Math.floor(z/n))+Math.abs(start%n-z%n)!==1)continue;
       const next=src.slice(0,j).reverse().concat(src.slice(j));if(side)next.reverse();
       const k=next.join(',');if(seen.has(k))continue;
       seen.add(k);q.push({p:next,first:first===null?side:first});
     }
   }
 }
}
$('board').addEventListener('pointerdown',start);$('board').addEventListener('pointermove',move);$('board').addEventListener('pointerup',end);$('board').addEventListener('pointercancel',()=>{drag=null;armed=null;draw()});$('undo').addEventListener('click',undo);$('hint').addEventListener('click',()=>{if(!won&&!lock){solveHint();tone('tap')}});$('reset').addEventListener('click',()=>{setLevel(level);tone('tap')});$('prev').addEventListener('click',()=>{setLevel(level-1);tone('tap')});$('next').addEventListener('click',()=>{setLevel(level+1);tone('tap')});$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'♫':'♪̸';save();if(sound)tone()});$('sound').textContent=sound?'♫':'♪̸';setLevel(level);
window.__ribbonTest={get:()=>({path:path.slice(),level,won,history:history.length}),move:(side,dest)=>{const next=changes(side,dest);if(!next)return false;history.push(path.slice());path=next;won=isWin();draw();return true},levels:defs};
